<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GvG — Admin</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="/js/auth.js"></script>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
            padding: 20px;
            max-width: 720px;
            margin: 0 auto;
        }

        h2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 28px;
            margin-bottom: 10px;
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hint {
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 14px;
            font-size: 13px;
            color: #aaa;
        }

        input, textarea, select {
            background: #222;
            color: #eee;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            width: 100%;
            margin-top: 6px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 90px;
            font-family: monospace;
            font-size: 13px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            margin-right: 8px;
            margin-top: 6px;
        }

        .primary {
            background: #2f6fb2;
        }

        .danger {
            background: #a4202a;
        }

        .secondary {
            background: #333;
        }

        .header-btn {
            font-size: 12px;
            padding: 6px 12px;
            background: #333;
        }

        .chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 20px;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #242424;
            border-radius: 20px;
            padding: 4px 6px 4px 12px;
            font-size: 13px;
        }

            .chip select {
                background: #333;
                color: #eee;
                border: none;
                border-radius: 14px;
                padding: 4px 8px;
                font-size: 12px;
                width: auto;
                margin: 0;
            }

        .chip-remove, .chip-action {
            background: #3a3a3a;
            color: #ccc;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
            font-size: 12px;
            margin: 0;
        }

            .chip-action.leader {
                background: #4a3a1a;
                color: #e8c07d;
            }

            .chip-action.player {
                background: #1a3a4a;
                color: #7dc0e8;
            }

        .empty-hint {
            color: #555;
            font-size: 13px;
            font-style: italic;
        }

        .squad-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .squad-edit-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #333;
        }

        .squad-edit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .leader-select {
            font-size: 12px;
            padding: 4px;
            background: #222;
            border: 1px solid #444;
            width: 100%;
            margin-bottom: 10px;
        }

        #log {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
            white-space: pre-wrap;
        }

        table {
            width: 100%;
            border-collapse: collapse;
            font-size: 13px;
            margin-top: 10px;
        }

            table th {
                color: #888;
                text-align: left;
                padding: 4px 8px;
            }

            table td {
                padding: 6px 8px;
                border-top: 1px solid #2a2a2a;
            }

        details {
            margin-top: 20px;
            border-top: 1px solid #2a2a2a;
            padding-top: 14px;
        }

        summary {
            cursor: pointer;
            color: #888;
            font-size: 13px;
            margin-bottom: 10px;
        }

        .menu-nav-btn {
            font-size: 12px;
            padding: 6px 12px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <h2>Admin Panel <span><a class="menu-nav-btn" href="/menu.html">☰ Меню</a><button class="header-btn" onclick="logout()">Выйти</button></span></h2>

    <h3>1. Добавить участников в пул</h3>
    <textarea id="pool-input" placeholder="Alice, Bob, Carol..."></textarea>
    <button class="primary" onclick="addToPool()">В пул</button>

    <h3>Свободные игроки (Unassigned)</h3>
    <div id="pool" class="chip-list"></div>

    <h3>2. Отряды — распределите игроков, назначьте роль и лидера</h3>
    <div class="hint">🎖 на имени — сделать лидером (доступ к панели Observer). 👤 — создать аккаунт игрока.</div>
    <div id="squads" class="squad-grid"></div>

    <div style="margin-top:20px;">
        <button class="primary" onclick="saveRoster()">Сохранить ростер</button>
        <button class="secondary" onclick="saveLogNow()">Сохранить лог сейчас</button>
        <button class="danger" onclick="resetHistory()">Сбросить историю (с архивацией)</button>
    </div>

    <h3>3. Аккаунты</h3>
    <div id="accounts-list"></div>

    <details>
        <summary>Добавить аккаунт Commander/Admin</summary>
        <label>Логин <input id="new-acc-username"></label>
        <label>Пароль <input id="new-acc-password" type="password"></label>
        <label>
            Роль
            <select id="new-acc-role">
                <option value="Commander">Commander</option>
                <option value="Admin">Admin</option>
            </select>
        </label>
        <button class="primary" onclick="addStandaloneAccount()">Создать</button>
    </details>

    <div id="log"></div>

    <script>
        const currentUser = requireAuth(['Admin']);

        let pool = [];
        let squads = ['T1', 'T2', 'T3', 'T4', 'T5', 'T6'].map(id => ({ squadId: id, side: 'Flex', leaderName: null, members: [] }));
        let initialized = false;

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/battleHub?access_token=" + encodeURIComponent(currentUser.token))
            .withAutomaticReconnect()
            .build();

        connection.on("RosterUpdated", roster => {
            if (!initialized) { loadRosterIntoUi(roster); initialized = true; }
            else log("Roster changed on the server. Reload if this wasn't you.");
        });

        connection.on("HistoryReset", () => log("History archived and reset (broadcast confirmed)."));

        connection.start()
            .then(() => { log("Connected."); refreshAccounts(); })
            .catch(err => log("Connection failed: " + err));

        // --- Pool ---

        function addToPool() {
            const raw = document.getElementById('pool-input').value;
            const names = raw.split(/[\n,]/).map(n => n.trim()).filter(Boolean);
            const existing = new Set([...pool, ...squads.flatMap(s => s.members)]);
            names.forEach(n => { if (!existing.has(n)) { pool.push(n); existing.add(n); } });
            document.getElementById('pool-input').value = '';
            renderPool();
        }

        function removeFromPool(index) { pool.splice(index, 1); renderPool(); }

        function assignFromPool(index, squadId) {
            if (!squadId) return;
            const name = pool[index];
            pool.splice(index, 1);
            const squad = squads.find(s => s.squadId === squadId);
            if (squad) squad.members.push(name);
            renderPool(); renderSquads();
        }

        function unassign(squadIndex, memberIndex) {
            const name = squads[squadIndex].members.splice(memberIndex, 1)[0];
            if (squads[squadIndex].leaderName === name) squads[squadIndex].leaderName = null;
            pool.push(name);
            renderPool(); renderSquads();
        }

        function setSquadSide(squadIndex, value) { squads[squadIndex].side = value; }

        // --- Squad member quick actions: leader / player account ---

        function makeAccount(name, squadId, role) {
            const username = prompt(`Логин для ${name}:`, name.toLowerCase().replace(/\s+/g, '.'));
            if (!username) return;
            const password = prompt(`Пароль для ${name}:`);
            if (!password) return;
            connection.invoke("UpsertAccount", { username, role, squadId: squadId || null, password })
                .then(() => { log(`Аккаунт создан: ${username} (${role}${squadId ? ', ' + squadId : ''})`); refreshAccounts(); })
                .catch(err => log("Error: " + err));
        }

        document.getElementById('squads').addEventListener('click', (e) => {
            const btn = e.target.closest('button[data-action]');
            if (!btn) return;
            const action = btn.dataset.action;
            const si = Number(btn.dataset.squadIndex);
            const mi = btn.dataset.memberIndex !== undefined ? Number(btn.dataset.memberIndex) : null;

            if (action === 'unassign') unassign(si, mi);
            if (action === 'make-leader') {
                const name = squads[si].members[mi];
                squads[si].leaderName = name;
                renderSquads();
                makeAccount(name, squads[si].squadId, 'Leader');
            }
            if (action === 'make-player') makeAccount(squads[si].members[mi], squads[si].squadId, 'Player');
        });

        // --- Rendering ---

        function renderPool() {
            const el = document.getElementById('pool');
            if (pool.length === 0) { el.innerHTML = '<span class="empty-hint">Пусто</span>'; return; }
            el.innerHTML = pool.map((name, i) => `
          <div class="chip">
            <span>${escapeHtml(name)}</span>
            <select onchange="assignFromPool(${i}, this.value)">
              <option value="">в отряд…</option>
              ${squads.map(s => `<option value="${s.squadId}">${s.squadId}</option>`).join('')}
            </select>
            <button class="chip-remove" onclick="removeFromPool(${i})">×</button>
          </div>
        `).join('');
        }

        function renderSquads() {
            const el = document.getElementById('squads');
            el.innerHTML = squads.map((sq, si) => `
          <div class="squad-edit-card">
            <div class="squad-edit-header">
              <strong>${sq.squadId}${sq.leaderName ? ' · 👑 ' + escapeHtml(sq.leaderName) : ''}</strong>
              <select onchange="setSquadSide(${si}, this.value)" style="width:auto; margin:0; padding:4px;">
                <option value="Defense" ${sq.side === 'Defense' ? 'selected' : ''}>Defense</option>
                <option value="Attack" ${sq.side === 'Attack' ? 'selected' : ''}>Attack</option>
                <option value="Flex" ${sq.side === 'Flex' ? 'selected' : ''}>Flex</option>
              </select>
            </div>
            <div class="chip-list">
              ${sq.members.length > 0
                    ? sq.members.map((m, mi) => `
                    <div class="chip">
                      <span>${escapeHtml(m)}</span>
                      <button class="chip-action leader" data-action="make-leader" data-squad-index="${si}" data-member-index="${mi}" title="Сделать лидером">🎖</button>
                      <button class="chip-action player" data-action="make-player" data-squad-index="${si}" data-member-index="${mi}" title="Создать аккаунт игрока">👤</button>
                      <button class="chip-remove" data-action="unassign" data-squad-index="${si}" data-member-index="${mi}" title="Убрать из отряда">×</button>
                    </div>
                  `).join('')
                    : '<span class="empty-hint">Empty</span>'}
            </div>
          </div>
        `).join('');
        }

        function loadRosterIntoUi(roster) {
            if (!roster || roster.length === 0) return;
            const bySquadId = Object.fromEntries(roster.map(s => [s.squadId, s]));
            squads = squads.map(s => bySquadId[s.squadId]
                ? { squadId: s.squadId, side: bySquadId[s.squadId].side || 'Flex', leaderName: bySquadId[s.squadId].leaderName || null, members: [...(bySquadId[s.squadId].members || [])] }
                : s);
            renderPool(); renderSquads();
        }

        // --- Save / reset / logs ---

        function saveRoster() {
            const payload = squads.map(s => ({ squadId: s.squadId, side: s.side, leaderName: s.leaderName, members: s.members }));
            connection.invoke("UpdateRoster", { squads: payload })
                .then(() => log(`Сохранено: ${payload.reduce((n, s) => n + s.members.length, 0)} человек в ${payload.length} отрядах.`))
                .catch(err => log("Error: " + err));
        }

        function resetHistory() {
            if (!confirm("История будет заархивирована в файл на сервере, затем очищена у всех. Продолжить?")) return;
            connection.invoke("ResetHistory")
                .then(() => log("Reset requested."))
                .catch(err => log("Error: " + err));
        }

        function saveLogNow() {
            connection.invoke("SaveLogSnapshot")
                .then(fileName => log(`Log saved: logs/${fileName} (история не очищена)`))
                .catch(err => log("Error: " + err));
        }

        // --- Accounts ---

        async function refreshAccounts() {
            try {
                const accounts = await connection.invoke("ListAccounts");
                const el = document.getElementById('accounts-list');
                if (accounts.length === 0) { el.innerHTML = '<span class="empty-hint">Аккаунтов пока нет.</span>'; return; }
                el.innerHTML = '<table><tr><th>Логин</th><th>Роль</th><th>Отряд</th><th></th></tr>' +
                    accounts.map(a => `
              <tr>
                <td>${escapeHtml(a.username)}</td>
                <td>${a.role}</td>
                <td>${a.squadId || '—'}</td>
                <td><button class="chip-remove" data-delete-username="${escapeHtml(a.username)}" title="Удалить">×</button></td>
              </tr>
            `).join('') + '</table>';
            } catch (err) {
                log("Failed to load accounts: " + err);
            }
        }

        document.getElementById('accounts-list').addEventListener('click', e => {
            const btn = e.target.closest('button[data-delete-username]');
            if (!btn) return;
            const username = btn.dataset.deleteUsername;
            if (!confirm(`Удалить аккаунт "${username}"?`)) return;
            connection.invoke("DeleteAccount", username)
                .then(() => { log(`Deleted: ${username}`); refreshAccounts(); })
                .catch(err => log("Error: " + err));
        });

        function addStandaloneAccount() {
            const username = document.getElementById('new-acc-username').value.trim();
            const password = document.getElementById('new-acc-password').value;
            const role = document.getElementById('new-acc-role').value;
            if (!username || !password) { log("Заполните логин и пароль."); return; }

            connection.invoke("UpsertAccount", { username, role, squadId: null, password })
                .then(() => {
                    log(`Account created: ${username} (${role})`);
                    document.getElementById('new-acc-username').value = '';
                    document.getElementById('new-acc-password').value = '';
                    refreshAccounts();
                })
                .catch(err => log("Error: " + err));
        }

        function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        function log(msg) {
            const el = document.getElementById('log');
            el.textContent = new Date().toLocaleTimeString() + "  " + msg + "\n" + el.textContent;
        }
    </script>
</body>
</html>
