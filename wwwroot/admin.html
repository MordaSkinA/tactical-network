<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GvG — Admin</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="/js/auth.js"></script>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
            padding: 20px;
            max-width: 720px;
            margin: 0 auto;
        }

        h2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        h3 {
            margin-top: 28px;
            margin-bottom: 10px;
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .hint {
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }

        label {
            display: block;
            margin-bottom: 14px;
            font-size: 13px;
            color: #aaa;
        }

        input, textarea, select {
            background: #222;
            color: #eee;
            border: 1px solid #444;
            border-radius: 6px;
            padding: 10px;
            font-size: 14px;
            width: 100%;
            margin-top: 6px;
            box-sizing: border-box;
        }

        textarea {
            min-height: 90px;
            font-family: monospace;
            font-size: 13px;
        }

        button {
            padding: 10px 16px;
            border: none;
            border-radius: 8px;
            cursor: pointer;
            color: #fff;
            font-weight: 600;
            font-size: 14px;
            margin-right: 8px;
            margin-top: 6px;
        }

        .primary {
            background: #2f6fb2;
        }

        .danger {
            background: #a4202a;
        }

        .secondary {
            background: #333;
        }

        .logout-btn {
            background: #333;
            font-size: 12px;
            padding: 6px 12px;
        }

        .auth-card {
            background: #1a1a1a;
            padding: 15px;
            border-radius: 8px;
            border: 1px solid #333;
            margin-bottom: 20px;
        }

            .auth-card h4 {
                margin-top: 0;
                color: #00bcd4;
            }

        .chip-list {
            display: flex;
            flex-wrap: wrap;
            gap: 8px;
            min-height: 20px;
        }

        .chip {
            display: flex;
            align-items: center;
            gap: 6px;
            background: #242424;
            border-radius: 20px;
            padding: 4px 6px 4px 12px;
            font-size: 13px;
        }

            .chip select {
                background: #333;
                color: #eee;
                border: none;
                border-radius: 14px;
                padding: 4px 8px;
                font-size: 12px;
                width: auto;
                margin: 0;
            }

        .chip-remove {
            background: #3a3a3a;
            color: #ccc;
            border: none;
            border-radius: 50%;
            width: 20px;
            height: 20px;
            line-height: 1;
            cursor: pointer;
            padding: 0;
        }

        .squad-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
        }

        .squad-edit-card {
            background: #1a1a1a;
            border-radius: 10px;
            padding: 12px;
            border: 1px solid #333;
        }

        .squad-edit-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }

        .leader-select {
            font-size: 12px;
            padding: 4px;
            background: #222;
            border: 1px solid #444;
            width: 100%;
            margin-bottom: 10px;
        }

        #log {
            font-size: 12px;
            color: #777;
            margin-top: 20px;
            white-space: pre-wrap;
        }
    </style>
</head>
<body>
    <h2>Admin Panel <button class="logout-btn" onclick="logout()">Выйти</button></h2>

    <div class="auth-card">
        <label>
            Мастер-ключ сервера (нужен для сохранения данных):
            <input type="password" id="master-key" placeholder="gvg-admin" value="gvg-admin">
        </label>
    </div>

    <div class="auth-card">
        <h4>Создать пользователя</h4>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 10px;">
            <input type="text" id="new-user-name" placeholder="Логин (Username)">
            <input type="password" id="new-user-pass" placeholder="Пароль">
            <select id="new-user-role">
                <option value="Player">Игрок (Player)</option>
                <option value="Leader">Лидер отряда (Leader)</option>
                <option value="Commander">Командир (Commander)</option>
                <option value="Admin">Админ (Admin)</option>
            </select>
            <input type="text" id="new-user-squad" placeholder="Отряд (например, T1) - только для Игроков/Лидеров">
        </div>
        <button class="primary" onclick="createUser()" style="margin-top:10px;">Создать аккаунт</button>
    </div>

    <div id="panel">
        <h3>1. Добавить участников в пул</h3>
        <textarea id="pool-input" placeholder="Alice, Bob, Carol..."></textarea>
        <button class="primary" onclick="addToPool()">В пул</button>

        <h3>Свободные игроки (Unassigned)</h3>
        <div id="pool" class="chip-list"></div>

        <h3>2. Отряды (Squads) - Распределите игроков и выберите Лидеров</h3>
        <div id="squads" class="squad-grid"></div>

        <div style="margin-top:20px;">
            <button class="primary" onclick="saveRoster()">Сохранить Ростер</button>
            <button class="danger" onclick="resetHistory()">Сбросить историю боя</button>
        </div>

        <div id="log"></div>
    </div>

    <script>
        // Защита страницы: пускаем только Админов
        const currentUser = requireAuth(['Admin']);

        let pool = [];
        let squads = ['T1', 'T2', 'T3', 'T4', 'T5', 'T6'].map(id => ({ squadId: id, side: 'Flex', leaderName: null, members: [] }));
        let initialized = false;

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/battleHub")
            .withAutomaticReconnect()
            .build();

        connection.on("RosterUpdated", roster => {
            if (!initialized) {
                loadRosterIntoUi(roster);
                initialized = true;
            }
        });

        connection.on("HistoryReset", () => log("History reset (broadcast confirmed)."));

        connection.start()
            .then(() => log("SignalR Connected."))
            .catch(err => log("Connection failed: " + err));

        // --- User Management ---
        async function createUser() {
            const adminKey = document.getElementById('master-key').value;
            const username = document.getElementById('new-user-name').value.trim();
            const password = document.getElementById('new-user-pass').value;
            const role = document.getElementById('new-user-role').value;
            let squadId = document.getElementById('new-user-squad').value.trim();
            if (!squadId) squadId = null;

            if (!username || !password) return alert("Логин и пароль обязательны");

            try {
                const res = await fetch('/api/auth/create', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ adminKey, username, password, role, squadId })
                });
                if (res.ok) {
                    alert("Пользователь успешно создан!");
                    document.getElementById('new-user-name').value = '';
                    document.getElementById('new-user-pass').value = '';
                } else {
                    alert("Ошибка создания (возможно неверный мастер-ключ или пользователь существует)");
                }
            } catch (e) {
                alert("Ошибка сети");
            }
        }

        // --- Pool management ---
        function addToPool() {
            const raw = document.getElementById('pool-input').value;
            const names = raw.split(/[\n,]/).map(n => n.trim()).filter(Boolean);
            const existing = new Set([...pool, ...squads.flatMap(s => s.members)]);
            names.forEach(n => {
                if (!existing.has(n)) { pool.push(n); existing.add(n); }
            });
            document.getElementById('pool-input').value = '';
            renderPool();
        }

        function removeFromPool(index) { pool.splice(index, 1); renderPool(); }

        function assignFromPool(index, squadId) {
            if (!squadId) return;
            const name = pool[index];
            pool.splice(index, 1);
            const squad = squads.find(s => s.squadId === squadId);
            if (squad) squad.members.push(name);
            renderPool(); renderSquads();
        }

        function unassign(squadIndex, memberIndex) {
            const name = squads[squadIndex].members.splice(memberIndex, 1)[0];
            if (squads[squadIndex].leaderName === name) squads[squadIndex].leaderName = null;
            pool.push(name);
            renderPool(); renderSquads();
        }

        function setSquadSide(squadIndex, value) { squads[squadIndex].side = value; }
        function setLeader(squadIndex, value) { squads[squadIndex].leaderName = value || null; }

        // --- Rendering ---
        function renderPool() {
            const el = document.getElementById('pool');
            if (pool.length === 0) return el.innerHTML = '<span class="empty-hint">Пусто</span>';
            el.innerHTML = pool.map((name, i) => `
          <div class="chip">
            <span>${escapeHtml(name)}</span>
            <select onchange="assignFromPool(${i}, this.value)">
              <option value="">в отряд…</option>
              ${squads.map(s => `<option value="${s.squadId}">${s.squadId}</option>`).join('')}
            </select>
            <button class="chip-remove" onclick="removeFromPool(${i})">×</button>
          </div>
        `).join('');
        }

        function renderSquads() {
            const el = document.getElementById('squads');
            el.innerHTML = squads.map((sq, si) => `
          <div class="squad-edit-card">
            <div class="squad-edit-header">
              <strong>${sq.squadId}</strong>
              <select onchange="setSquadSide(${si}, this.value)" style="width:auto; margin:0; padding: 4px;">
                <option value="Defense" ${sq.side === 'Defense' ? 'selected' : ''}>Defense</option>
                <option value="Attack" ${sq.side === 'Attack' ? 'selected' : ''}>Attack</option>
                <option value="Flex" ${sq.side === 'Flex' ? 'selected' : ''}>Flex</option>
              </select>
            </div>
            <select class="leader-select" onchange="setLeader(${si}, this.value)">
               <option value="">-- Без Лидера --</option>
               ${sq.members.map(m => `<option value="${escapeHtml(m)}" ${sq.leaderName === m ? 'selected' : ''}>👑 ${escapeHtml(m)}</option>`).join('')}
            </select>
            <div class="chip-list">
              ${sq.members.length > 0
                    ? sq.members.map((m, mi) => `
                    <div class="chip">
                      <span>${escapeHtml(m)}</span>
                      <button class="chip-remove" onclick="unassign(${si}, ${mi})">×</button>
                    </div>
                  `).join('')
                    : '<span class="empty-hint">Empty</span>'}
            </div>
          </div>
        `).join('');
        }

        function loadRosterIntoUi(roster) {
            if (!roster || roster.length === 0) return;
            const bySquadId = Object.fromEntries(roster.map(s => [s.squadId, s]));
            squads = squads.map(s => bySquadId[s.squadId]
                ? { squadId: s.squadId, side: bySquadId[s.squadId].side || 'Flex', leaderName: bySquadId[s.squadId].leaderName || null, members: [...(bySquadId[s.squadId].members || [])] }
                : s);
            renderPool(); renderSquads();
        }

        function saveRoster() {
            const adminKey = document.getElementById('master-key').value;
            const payload = squads.map(s => ({ squadId: s.squadId, side: s.side, leaderName: s.leaderName, members: s.members }));
            connection.invoke("UpdateRoster", { adminKey, squads: payload })
                .then(() => log(`Saved roster.`))
                .catch(err => log("Error: " + err));
        }

        function resetHistory() {
            const adminKey = document.getElementById('master-key').value;
            if (!confirm("Reset all events/orders on all connected screens?")) return;
            connection.invoke("ResetHistory", { adminKey })
                .then(() => log("Reset requested."))
                .catch(err => log("Error: " + err));
        }

        function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
        function log(msg) {
            const el = document.getElementById('log');
            el.textContent = new Date().toLocaleTimeString() + "  " + msg + "\n" + el.textContent;
        }
    </script>
</body>
</html>
