<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GvG - Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script src="/js/i18n.js"></script>
    <script src="/js/auth.js"></script>
<link rel="stylesheet" href="/css/theme.css">
<script src="/js/sidebar.js"></script>
<script src="/js/overlay-hud.js"></script>
<style>
  #app-content { display: flex; justify-content: center; }
  #dash-inner { width: 100%; max-width: 720px; }
  body { background:#0b0b0b; color:#eee; font-family: system-ui, sans-serif; }
  h2 { margin-bottom: 2px; }
  #status { color:#666; font-size:12px; margin-bottom: 4px; }
  #battle-status { font-size:13px; font-weight:600; margin-bottom: 18px; padding: 8px 12px; border-radius: 6px; display:inline-block; }
  #battle-status.active   { background:#1a2e1a; color:#7dd87d; }
  #battle-status.inactive { background:#2a2a2a; color:#999; }
  #spawn-toast {
    position: fixed; top: 20px; left: 50%; transform: translateX(-50%) translateY(-18px) scale(0.94);
    opacity: 0; visibility: hidden;
    z-index: 1000; display: flex; align-items: center; gap: 12px;
    max-width: 420px; width: calc(100% - 32px); padding: 13px 20px 13px 14px;
    border-radius: 14px; background: #1a160e; color: #f0d99a;
    box-shadow: 0 12px 32px rgba(0,0,0,0.55), 0 0 0 1px rgba(240,217,154,0.16), inset 0 1px 0 rgba(255,255,255,0.04);
    overflow: hidden;
    transition: transform 0.35s cubic-bezier(.34,1.56,.64,1), opacity 0.25s ease, visibility 0.35s;
  }
  #spawn-toast.show { transform: translateX(-50%) translateY(0) scale(1); opacity: 1; visibility: visible; }
  #spawn-toast .st-icon {
    flex: 0 0 auto; width: 32px; height: 32px; border-radius: 50%;
    display: flex; align-items: center; justify-content: center;
    background: rgba(240,217,154,0.14); color: #f0d99a;
    animation: stPulseGold 1.7s ease-in-out infinite;
  }
  #spawn-toast .st-text { flex: 1 1 auto; font-weight: 700; font-size: 13.5px; letter-spacing: 0.03em; text-align: left; line-height: 1.3; }
  #spawn-toast .st-bar {
    position: absolute; left: 0; bottom: 0; height: 3px; width: 100%;
    background: linear-gradient(90deg, #f0d99a, rgba(240,217,154,0));
    transform-origin: left; animation: stCountdown 8s linear forwards;
  }
  #spawn-toast.kind-Boss { background:#1e1414; color:#f7b3b8; box-shadow: 0 12px 32px rgba(0,0,0,0.55), 0 0 0 1px rgba(224,82,96,0.22), inset 0 1px 0 rgba(255,255,255,0.04); }
  #spawn-toast.kind-Boss .st-icon { background: rgba(224,82,96,0.16); color: #e05260; animation: stPulseRed 1.15s ease-in-out infinite; }
  #spawn-toast.kind-Boss .st-bar { background: linear-gradient(90deg, #e05260, rgba(224,82,96,0)); }
  @keyframes stPulseGold { 0%, 100% { box-shadow: 0 0 0 0 rgba(240,217,154,0.35); } 50% { box-shadow: 0 0 0 6px rgba(240,217,154,0); } }
  @keyframes stPulseRed { 0%, 100% { box-shadow: 0 0 0 0 rgba(224,82,96,0.45); } 50% { box-shadow: 0 0 0 7px rgba(224,82,96,0); } }
  @keyframes stCountdown { from { transform: scaleX(1); } to { transform: scaleX(0); } }
  .feed-item {
    padding: 12px 14px; margin-bottom: 8px; border-radius: 8px;
    border-left: 4px solid #555; background:#1a1a1a;
  }
  .Critical { border-left-color:#e33; }
  .Warning  { border-left-color:#e8a33d; }
  .Info     { border-left-color:#3d8ee8; }
  .order-item { border-left-color:#8a4de8; }
  .cat-critical    { border-left-color:#6e1c1c; }
  .cat-attack      { border-left-color:#c1622b; }
  .cat-attack-key  { border-left-color:#e8790f; }
  .cat-defend      { border-left-color:#4c7a4f; }
  .cat-hold        { border-left-color:#2e5230; }
  .cat-protect     { border-left-color:#4fae82; }
  .cat-tactic      { border-left-color:#7c6cf0; }
  .cat-fallback    { border-left-color:#4a90c4; }
  .cat-jungle      { border-left-color:#1e3a5f; }
  .cat-neutral     { border-left-color:#6b7280; }
  .title { font-weight: 600; font-size: 15px; }
  .meta { color:#888; font-size:12px; margin-top: 3px; }
  #roster { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  #reserves-section { margin-bottom: 24px; }
  #reserves-section h4 { margin: 0 0 6px 0; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  #reserves-section:empty { display: none; }
  .reserve-card { background:#161616; border-radius:8px; padding:10px 12px; border-left: 3px solid #555; }
  .squad-card { background:#161616; border-radius:8px; padding:10px 12px; }
  .squad-card h4 { margin:0 0 4px 0; font-size:13px; color:#aaa; }
  .squad-card .members { font-size:13px; color:#ccc; display: flex; flex-direction: column; gap: 4px; }
  .member-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .role-badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .role-badge.Dps { background: #3a1a1a; color: #e88a8a; }
  .role-badge.Tank { background: #1a2a3a; color: #7dc0e8; }
  .role-badge.Healer { background: #1a3a1a; color: #7dd87d; }
  .tag-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #2a2a2a; color: #999; }
  .comp-warning {
    font-size: 10px; font-weight: 700; color: #f0a0a0; background: #2a1414;
    border: 1px solid #6e1c1c; border-radius: 4px; padding: 2px 7px; margin: 4px 0; display: inline-block;
  }
  .bulwark-badge { font-size: 12px; }
  .presence-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; background: #444; }
  .presence-dot.online { background: #4fd15a; box-shadow: 0 0 5px #4fd15a; }
  .squad-card.Defense { border-left: 3px solid #3d8ee8; }
  .squad-card.Attack  { border-left: 3px solid #e8a33d; }
  .squad-card.Flex    { border-left: 3px solid #8a4de8; }
  .menu-nav-btn { font-size: 12px; padding: 6px 12px; background: #333; border: none; border-radius: 4px; color: #fff; cursor: pointer; text-decoration: none; margin-right: 8px; }
  .logout-btn { font-size: 11px; padding: 4px 8px; background: #333; border: none; border-radius: 4px; color: #fff; cursor: pointer; text-decoration: none; margin-right: 6px; }
  #order-panel { margin-bottom: 20px; background: #161616; border-radius: 8px; padding: 14px; }
  #order-panel h4 { margin: 0 0 10px 0; font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; }
  #order-target-label { font-size: 12px; color: #888; margin-bottom: 8px; }
  #order-target-label strong { color: #eee; }
  #order-squad-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .squad-chip {
    font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px;
    border: 2px solid #3a3a3a; background: #202020; color: #bbb; cursor: pointer;
  }
  .squad-chip:active { transform: scale(0.96); }
  .squad-chip.selected { border-color: #eee; background: #7c6cf0; color: #fff; }
  #order-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  #order-buttons.disabled { opacity: 0.4; pointer-events: none; }
  .order-btn { font-size: 13px; padding: 8px 12px; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-weight: 600; }
  .order-btn:active { transform: scale(0.97); }
  .order-btn.attack     { background: #c1622b; }
  .order-btn.attack-key { background: #e8790f; }
  .order-btn.defend     { background: #4c7a4f; }
  .order-btn.hold       { background: #2e5230; }
  .order-btn.protect    { background: #4fae82; }
  .order-btn.tactic     { background: #7c6cf0; }
  .order-btn.fallback   { background: #4a90c4; }
  .order-btn.jungle     { background: #1e3a5f; }
  .squad-card { cursor: pointer; border: 2px solid transparent; position: relative; overflow: hidden; }
  .squad-card.targeted { border-color: #eee; box-shadow: 0 0 0 1px #eee inset; }

  /* Multi-select */
  #order-target-actions { display: flex; gap: 8px; margin: -4px 0 12px 0; }
  .order-target-action {
    font-size: 11px; padding: 4px 10px; border-radius: 999px; border: 1px solid #3a3a3a;
    background: transparent; color: #999; cursor: pointer;
  }
  .order-target-action:hover { color: #eee; border-color: #666; }
  .squad-chip { position: relative; }
  .squad-chip .chip-check {
    display: none; margin-right: 4px; font-weight: 900;
  }
  .squad-chip.selected .chip-check { display: inline; }


  .squad-card { padding-right: 18px; }
  .status-side {
    position: absolute; top: 6px; right: 0; bottom: 6px; width: 6px; border-radius: 4px 0 0 4px;
    background: linear-gradient(180deg, transparent 0%, var(--status-color, #444) 20%, var(--status-color, #444) 80%, transparent 100%);
    opacity: 0; transition: opacity 0.4s ease;
    box-shadow: -2px 0 10px -2px var(--status-color, transparent);
  }
  .status-side.active { opacity: 1; }
  .status-label {
    display: none; align-items: center; gap: 6px;
    font-size: 11px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: var(--status-color, #aaa); margin-top: 8px;
  }
  .status-label.active { display: flex; }
  .status-dot {
    width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto;
    background: var(--status-color, #aaa); box-shadow: 0 0 6px var(--status-color, transparent);
  }

  /* Current order badge on squad tiles */
  .order-current {
    display: none; align-items: center; gap: 6px; width: fit-content;
    font-size: 10px; font-weight: 700; letter-spacing: 0.03em; text-transform: uppercase;
    color: #fff; margin-top: 8px; padding: 3px 8px; border-radius: 4px;
  }
  .order-current.show { display: inline-flex; }
  .order-current.attack     { background: #c1622b; }
  .order-current.attack-key { background: #e8790f; }
  .order-current.defend     { background: #4c7a4f; }
  .order-current.hold       { background: #2e5230; }
  .order-current.jungle     { background: #1e3a5f; }

  /* Attack/Defense quick-select buttons */
  .order-target-action.side-attack  { border-color: #c1622b; color: #e29a6b; }
  .order-target-action.side-attack:hover  { color: #fff; background: #c1622b; }
  .order-target-action.side-defense { border-color: #4c7a4f; color: #8ec092; }
  .order-target-action.side-defense:hover { color: #fff; background: #4c7a4f; }

  /* Section separation */
  .section-heading {
    display: flex; align-items: center; gap: 10px;
    margin: 22px 0 10px 0; font-size: 12px; font-weight: 700; color: #888;
    text-transform: uppercase; letter-spacing: 0.08em;
  }
  .section-heading:first-of-type { margin-top: 6px; }
  .section-heading::after { content: ''; flex: 1; height: 1px; background: #2a2a2a; }
  #feed-section {
    background: #121212; border: 1px solid #232323; border-radius: 10px;
    padding: 14px; margin-top: 4px;
  }
  #feed-section .section-heading { margin-top: 0; }
  #feed:empty::after { content: attr(data-empty-text); color: #555; font-size: 13px; }

  /* Order macros */
  #macro-panel { margin-bottom: 20px; background: #161616; border-radius: 8px; padding: 14px; }
  #macro-panel h4 { margin: 0 0 10px 0; font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; }
  #macro-list { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 4px; }
  #macro-list:empty::after { content: attr(data-empty-text); color: #555; font-size: 12px; }
  .macro-btn {
    display: flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
    padding: 8px 10px 8px 14px; border-radius: 999px; border: none; color: #fff;
    background: #3a2f6e; cursor: pointer;
  }
  .macro-btn:active { transform: scale(0.97); }
  .macro-btn .macro-delete {
    background: rgba(0,0,0,0.25); border: none; color: #ddd; width: 18px; height: 18px;
    border-radius: 50%; line-height: 1; font-size: 11px; cursor: pointer; padding: 0;
  }
  #macro-save-row { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 10px; }
  #macro-save-row input {
    flex: 1 1 160px; background: #222; color: #eee; border: 1px solid #444; border-radius: 6px;
    padding: 8px 10px; font-size: 13px;
  }
  #macro-save-btn { font-size: 12px; padding: 8px 12px; border: none; border-radius: 6px; background: #333; color: #fff; cursor: pointer; }

  /* Order type dropdown (custom, replaces bare <select>) */
  .order-type-select { position: relative; flex: 1 1 170px; }
  .order-type-trigger {
    width: 100%; display: flex; align-items: center; gap: 8px;
    background: #222; color: #eee; border: 1px solid #444; border-radius: 6px;
    padding: 8px 10px; font-size: 13px; cursor: pointer; text-align: left;
  }
  .order-type-trigger:hover { border-color: #666; }
  .order-type-trigger:focus-visible { outline: 2px solid #9b8ff5; outline-offset: 1px; }
  .order-type-trigger .order-type-label { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
  .order-type-trigger .order-type-caret { color: #777; font-size: 10px; transition: transform 0.15s ease; }
  .order-type-select.open .order-type-caret { transform: rotate(180deg); }
  .order-type-dot { width: 10px; height: 10px; border-radius: 50%; flex: 0 0 auto; background: #555; }
  .order-type-dot.attack     { background: #c1622b; }
  .order-type-dot.attack-key { background: #e8790f; }
  .order-type-dot.defend     { background: #4c7a4f; }
  .order-type-dot.hold       { background: #2e5230; }
  .order-type-dot.protect    { background: #4fae82; }
  .order-type-dot.tactic     { background: #7c6cf0; }
  .order-type-dot.fallback   { background: #4a90c4; }
  .order-type-dot.jungle     { background: #1e3a5f; }
  .order-type-menu {
    display: none; position: absolute; top: calc(100% + 4px); left: 0; right: 0; z-index: 20;
    max-height: 260px; overflow-y: auto; background: #1c1c1c; border: 1px solid #333;
    border-radius: 8px; box-shadow: 0 8px 24px rgba(0,0,0,0.5); padding: 4px;
  }
  .order-type-select.open .order-type-menu { display: block; }
  .order-type-option {
    display: flex; align-items: center; gap: 8px; padding: 8px 10px; font-size: 13px;
    color: #ddd; border-radius: 6px; cursor: pointer;
  }
  .order-type-option:hover, .order-type-option.highlighted { background: #2a2a2a; }
  .order-type-option.selected { color: #fff; background: #262626; }

  /* Goal order — issue panel */
  #goal-order-panel { margin-bottom: 20px; background: #161616; border-radius: 8px; padding: 14px; }
  #goal-order-panel h4 {
    display: flex; align-items: baseline; gap: 8px; margin: 0 0 10px 0;
    font-size: 13px; color: #9b8ff5; text-transform: uppercase; letter-spacing: 0.05em;
  }
  #goal-order-panel h4 svg { flex: 0 0 auto; }
  .gop-subtitle { text-transform: none; letter-spacing: 0; font-size: 11.5px; color: #777; font-weight: 400; }
  #goal-order-panel textarea,
  #goal-order-panel input[type="text"],
  #goal-order-panel input[type="number"],
  #goal-order-panel select {
    background: #1e1e1e; border: 1px solid #3a3a3a; border-radius: 6px;
    padding: 9px 11px; color: #eee; font-size: 13px; font-family: inherit; box-sizing: border-box;
  }
  #goal-order-panel textarea:focus, #goal-order-panel input:focus, #goal-order-panel select:focus {
    outline: none; border-color: #7c6cf0;
  }
  #goal-order-panel input[type="number"] {
    -moz-appearance: textfield;
  }
  #goal-order-panel input[type="number"]::-webkit-outer-spin-button,
  #goal-order-panel input[type="number"]::-webkit-inner-spin-button {
    -webkit-appearance: none;
    margin: 0;
  }
  #goal-order-panel textarea { width: 100%; resize: vertical; }
  .gop-filters { display: flex; flex-wrap: wrap; gap: 14px 20px; margin: 12px 0 4px; }
  .gop-field { flex: 1 1 170px; }
  .gop-field-narrow { flex: 0 1 110px; }
  .gop-field label {
    display: block; font-size: 11px; color: #888; margin-bottom: 6px;
    font-weight: 600; text-transform: uppercase; letter-spacing: 0.03em;
  }
  .gop-field label .gop-hint { text-transform: none; font-weight: 400; color: #666; }
  .gop-field input, .gop-field select { width: 100%; }
  .gop-cb-row { display: flex; flex-wrap: wrap; gap: 8px 16px; padding-top: 2px; }
  .gop-cb { display: flex; align-items: center; gap: 6px; font-size: 12.5px; color: #ccc; cursor: pointer; }
  .gop-actions { display: flex; flex-wrap: wrap; align-items: center; gap: 12px; margin-top: 14px; }
  .gop-send-btn {
    font-size: 13px; font-weight: 700; padding: 9px 18px; border: none;
    border-radius: 999px; background: #7c6cf0; color: #fff; cursor: pointer;
  }
  .gop-send-btn:active { transform: scale(0.97); }
  .gop-macro-save { display: flex; gap: 8px; flex: 1 1 240px; }
  .gop-macro-save input { flex: 1 1 auto; }
  .gop-save-btn {
    font-size: 12px; padding: 9px 14px; border: 1px solid #3a3a3a; border-radius: 6px;
    background: transparent; color: #bbb; cursor: pointer; white-space: nowrap;
  }
  .gop-save-btn:hover { color: #eee; border-color: #666; }
  #goal-macro-list { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; }
  #goal-macro-list:empty { display: none; }
  .gop-macro-btn {
    display: inline-flex; align-items: center; gap: 8px; font-size: 13px; font-weight: 600;
    padding: 8px 10px 8px 14px; border-radius: 999px; border: none; color: #fff;
    background: #3a2f6e; cursor: pointer;
  }
  .gop-macro-btn:active { transform: scale(0.97); }
  .gop-macro-delete {
    background: rgba(0,0,0,0.25); border: none; color: #ddd; width: 18px; height: 18px;
    border-radius: 50%; line-height: 1; font-size: 11px; cursor: pointer; padding: 0;
  }



  #hud-controls { display: none; }

  body.tacnet-hud #app-sidebar,
  body.tacnet-hud h2,
  body.tacnet-hud #status,
  body.tacnet-hud #macro-panel,
  body.tacnet-hud .section-heading,
  body.tacnet-hud #reserves-section {
    display: none !important;
  }

  body.tacnet-hud #app-content { display: block !important; }
  body.tacnet-hud #dash-inner { width: auto !important; max-width: none !important; }

  body.tacnet-hud #hud-controls {
    display: flex;
    position: fixed;
    top: 14px;
    right: 14px;
    align-items: center;
    gap: 8px;
    padding: 6px 8px;
    border-radius: 10px;
    background: rgba(10, 10, 10, 0.6);
    backdrop-filter: blur(4px);
    z-index: 2000;
  }

    body.tacnet-hud #hud-controls #hud-status {
      font-size: 11px;
      color: #999;
      white-space: nowrap;
      margin-right: 2px;
    }

  body.tacnet-hud #battle-status  { position: fixed; top: 18px; left: 18px; width: 260px; max-width: 34vw; margin: 0; z-index: 1500; }
  body.tacnet-hud #battle-controls {
    position: fixed; top: 68px; left: 18px; width: 260px; max-width: 34vw; margin: 0 !important; z-index: 1500;
    display: flex; gap: 8px; padding: 8px; border-radius: 10px;
    background: rgba(20, 20, 20, 0.75); backdrop-filter: blur(3px);
  }
  body.tacnet-hud #feed-section {
    position: fixed; top: 130px; left: 18px; width: 300px; max-width: 34vw;
    max-height: calc(100vh - 150px); overflow-y: auto; margin: 0; z-index: 1500;
  }
  body.tacnet-hud #order-panel {
    position: fixed; top: 54px; right: 14px; width: 300px; max-width: 34vw;
    max-height: calc(50vh - 60px); overflow-y: auto; margin: 0; z-index: 1500;
  }
  body.tacnet-hud #goal-order-panel {
    position: fixed; top: calc(50vh - 6px); right: 14px; width: 300px; max-width: 34vw;
    max-height: calc(50vh - 20px); overflow-y: auto; margin: 0; z-index: 1500;
    background: rgba(20, 20, 20, 0.75); backdrop-filter: blur(3px); border-radius: 10px;
  }
    body.tacnet-hud #goal-order-panel h4 { font-size: 11px; margin: 0 0 8px; }
    body.tacnet-hud #goal-order-panel .gop-subtitle { display: none; }
    body.tacnet-hud #goal-order-panel .gop-filters { gap: 10px 14px; margin: 10px 0 2px; }


  body.tacnet-hud #roster {
    position: fixed; top: 14px; left: calc(50% - 150px); width: 300px; max-width: 34vw;
    max-height: 40vh; overflow-y: auto; margin: 0; z-index: 1500;
    display: flex; flex-direction: column; gap: 8px;
  }

  body.tacnet-hud #spawn-toast { z-index: 2500; }

 
  body.tacnet-hud.tacnet-edit-mode .tacnet-widget {
    outline: 2px dashed rgba(155, 143, 245, 0.85);
    outline-offset: 3px;
    cursor: grab;
    touch-action: none;
    user-select: none;
  }
  body.tacnet-hud.tacnet-edit-mode .tacnet-widget:active { cursor: grabbing; }
  body.tacnet-hud .tacnet-widget.tacnet-user-hidden { display: none !important; }
  body.tacnet-hud.tacnet-edit-mode .tacnet-widget.tacnet-user-hidden {
    display: block !important;
    opacity: 0.35;
  }
  body.tacnet-hud.tacnet-edit-mode #battle-controls.tacnet-user-hidden {
    display: flex !important;
    opacity: 0.35;
  }

  #tacnet-edit-palette {
    position: fixed; bottom: 44px; left: 18px; z-index: 3000;
    background: rgba(12, 12, 14, 0.92); border: 1px solid rgba(155, 143, 245, 0.4);
    border-radius: 10px; padding: 10px 12px; font-size: 12px; color: #ddd;
    box-shadow: 0 10px 28px rgba(0,0,0,0.5);
  }
  #tacnet-edit-palette .tep-title { font-weight: 700; margin-bottom: 6px; color: #b8aef7; }
  #tacnet-edit-palette .tep-hint { font-size: 11px; color: #999; margin-bottom: 8px; max-width: 220px; }
  #tacnet-edit-palette .tep-row { display: flex; align-items: center; gap: 6px; padding: 3px 0; cursor: pointer; }
  #tacnet-edit-palette button {
    margin-top: 8px; width: 100%; padding: 5px 0; font-size: 11px;
    background: #333; border: none; border-radius: 5px; color: #fff; cursor: pointer;
  }
</style>
</head>
<body>
  <div id="app-sidebar"></div>

  <div id="hud-controls">
    <span id="hud-status"></span>
    <a class="menu-nav-btn" style="background:#333;" href="/menu.html" data-i18n="common.menu">Menu</a>
    <button class="logout-btn" type="button" onclick="logout()" data-i18n="common.logout">Log out</button>
  </div>

  <div id="app-content"><div id="dash-inner">
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
    <h2 style="margin: 0;" data-i18n="dashboard.pageTitle">Main Commander. Live Feed</h2>
  </div>
  <div id="status">connecting...</div>
  <div id="battle-status" class="inactive">No active battle</div>
  <div id="battle-controls" style="margin-bottom: 14px;">
    <button class="menu-nav-btn" style="background:#2e5230;" onclick="startBattleFromDashboard()" data-i18n="dashboard.startBattle">Start Battle</button>
    <button class="menu-nav-btn" style="background:#6e1c1c;" onclick="endBattleFromDashboard()" data-i18n="dashboard.endBattle">End Battle</button>
  </div>
  <div id="spawn-toast"></div>

  <div id="macro-panel">
    <h4 data-i18n="dashboard.orderMacros">Order macros</h4>
    <div id="macro-list"></div>
    <div id="macro-save-row">
      <input id="macro-name-input" data-i18n-placeholder="dashboard.macroNamePlaceholder" placeholder="Macro name, e.g. Fall back everyone">
      <div class="order-type-select" id="macro-order-type-select">
        <button type="button" class="order-type-trigger" id="macro-order-type-trigger"
                onclick="toggleMacroOrderTypeMenu()" aria-haspopup="listbox" aria-expanded="false">
          <span class="order-type-dot" id="macro-order-type-dot"></span>
          <span class="order-type-label" id="macro-order-type-label">Choose order…</span>
          <span class="order-type-caret">▾</span>
        </button>
        <div class="order-type-menu" id="macro-order-type-menu" role="listbox"></div>
      </div>
      <label style="display:flex; align-items:center; gap:4px; color:#999; font-size:12px; white-space:nowrap;">
        <input type="checkbox" id="macro-all-squads" style="width:auto; flex:none;"> <span data-i18n="dashboard.allTeams">All teams</span>
      </label>
      <button id="macro-save-btn" onclick="saveCurrentAsMacro()" data-i18n="dashboard.saveAsMacro">Save as macro</button>
    </div>
    <div style="margin-top:6px; font-size:11px; color:#666;" id="macro-save-hint" data-i18n="dashboard.macroSaveHint">Uses the teams currently selected below, unless "All teams" is checked.</div>
  </div>

  <div id="order-panel">
    <h4 data-i18n="dashboard.issueOrder">Issue order</h4>
    <div id="order-target-label"><span data-i18n="dashboard.target">Target:</span> <strong id="order-target-value">none selected</strong></div>
    <div id="order-squad-chips"></div>
    <div id="order-target-actions">
      <button type="button" class="order-target-action" onclick="selectAllSquads()" data-i18n="dashboard.selectAll">Select all</button>
      <button type="button" class="order-target-action" onclick="clearSquadSelection()" data-i18n="dashboard.clear">Clear</button>
      <button type="button" class="order-target-action side-attack" onclick="selectSideSquads('Attack')" data-i18n="dashboard.selectAttack">Attack teams</button>
      <button type="button" class="order-target-action side-defense" onclick="selectSideSquads('Defense')" data-i18n="dashboard.selectDefense">Defense teams</button>
    </div>
    <div id="order-buttons" class="disabled"></div>
  </div>

  <div id="goal-order-panel">
    <h4>
      <svg viewBox="0 0 24 24" width="15" height="15" fill="none"><circle cx="12" cy="12" r="8.5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="4.5" stroke="currentColor" stroke-width="1.6"/><circle cx="12" cy="12" r="1.4" fill="currentColor"/></svg>
      <span>Goal order</span>
      <span class="gop-subtitle">micro reminder / target / goal</span>
    </h4>
    <textarea id="goal-order-text" rows="2" placeholder="e.g. Focus on enemy healer"></textarea>
    <div class="gop-filters">
      <div class="gop-field">
        <label>Builds <span class="gop-hint">(blank = any)</span></label>
        <input type="text" id="goal-order-builds" placeholder="e.g. Twinblades, Soulshade">
      </div>
      <div class="gop-field">
        <label>Roles</label>
        <div class="gop-cb-row">
          <label class="gop-cb"><input type="checkbox" class="cb goal-role-cb" value="Dps"> DPS</label>
          <label class="gop-cb"><input type="checkbox" class="cb goal-role-cb" value="Tank"> Tank</label>
          <label class="gop-cb"><input type="checkbox" class="cb goal-role-cb" value="Healer"> Healer</label>
        </div>
      </div>
      <div class="gop-field">
        <label>Squad side</label>
        <div class="gop-cb-row">
          <label class="gop-cb"><input type="checkbox" class="cb goal-side-cb" value="Attack"> Attack</label>
          <label class="gop-cb"><input type="checkbox" class="cb goal-side-cb" value="Defense"> Defense</label>
          <label class="gop-cb"><input type="checkbox" class="cb goal-side-cb" value="Flex"> Flex</label>
        </div>
      </div>
      <div class="gop-field gop-field-narrow">
        <label>Phase</label>
        <select id="goal-order-phase">
          <option value="">Any</option>
          <option value="Phase1">Phase 1</option>
          <option value="Phase2">Phase 2</option>
          <option value="Phase3">Phase 3</option>
        </select>
      </div>
      <div class="gop-field gop-field-narrow">
        <label>Timer, sec</label>
        <input type="number" id="goal-order-timer" min="1" placeholder="—">
      </div>
    </div>
    <div class="gop-actions">
      <button class="gop-send-btn" onclick="issueGoalOrder()">Send goal order</button>
      <div class="gop-macro-save">
        <input type="text" id="goal-macro-name" placeholder="Macro name to save this as">
        <button class="gop-save-btn" onclick="saveCurrentGoalAsMacro()">Save as macro</button>
      </div>
    </div>
    <div id="goal-macro-list"></div>
  </div>

  <div class="section-heading" data-i18n="menu.stats.teams">Teams</div>
  <div id="roster"></div>
  <div id="reserves-section"></div>

  <div id="feed-section">
    <div class="section-heading" data-i18n="dashboard.eventFeed">Event feed</div>
    <div id="feed"></div>
  </div>
  </div></div>

<script>
  const currentUser = requireAuth(['Commander', 'Admin', 'Developer']);
  renderSidebar('/dashboard.html');

  const connection = new signalR.HubConnectionBuilder()
    .withUrl("/battleHub?access_token=" + encodeURIComponent(currentUser.token))
    .withAutomaticReconnect()
    .build();

  const feed = document.getElementById('feed');
  feed.dataset.emptyText = t('dashboard.feedEmpty');

  const ORDER_CATEGORIES = {
    SquadWiped: 'critical',
    PushBot: 'attack', PushMid: 'attack', PushTop: 'attack', AttackGoose: 'attack',
    KillBoss: 'attack-key', Bomb: 'attack-key',
    DefendBot: 'defend', DefendMid: 'defend', DefendTop: 'defend', DefendGoose: 'defend', DefendTree: 'defend',
    Hold: 'hold',
    BotJungle: 'jungle', TopJungle: 'jungle'
  };
  function orderClass(type) {
    const category = ORDER_CATEGORIES[type];
    return category ? 'cat-' + category : 'order-item';
  }

  const STATUS_CLASSES = {
    SquadWiped: 'cat-critical', Regroup: 'cat-defend', NeedHelp: 'cat-protect',
    Retreating: 'cat-fallback', Autonomous: 'cat-neutral'
  };
  function statusClass(type) { return STATUS_CLASSES[type] || 'order-item'; }


  function formatLabel(type) {
    return type.replace(/([A-Z])/g, ' $1').trim().toUpperCase();
  }

  // Colors 
  const STATUS_COLORS = {
    SquadWiped:  '#e33',
    Regroup:     '#4c7a4f',
    NeedHelp:    '#4fae82',
    Retreating:  '#4a90c4',
    Autonomous:  '#6b7280'
  };

  // Status hold time
  const STATUS_HOLD_MS = 25000;
  const squadStatusState = new Map(); 
  const squadStatusTimers = new Map(); 

  function paintSquadStatus(squadId, type) {
    const card = document.querySelector(`.squad-card[data-squad-id="${CSS.escape(squadId)}"]`);
    if (!card) return;
    const side = card.querySelector('.status-side');
    const label = card.querySelector('.status-label');
    const dot = card.querySelector('.status-dot');
    const text = card.querySelector('.status-text');
    if (!side || !label) return;
    const color = STATUS_COLORS[type] || '#888';
    const labelText = t('statusTypes.' + type) || formatLabel(type);

    side.style.setProperty('--status-color', color);
    label.style.setProperty('--status-color', color);
    if (dot) dot.style.setProperty('--status-color', color);
    if (text) text.textContent = labelText;
    side.classList.add('active');
    label.classList.add('active');
  }

  function scheduleAutonomousRevert(squadId, delayMs) {
    if (squadStatusTimers.has(squadId)) clearTimeout(squadStatusTimers.get(squadId));
    const revert = () => {
      squadStatusTimers.delete(squadId);
      squadStatusState.set(squadId, { type: 'Autonomous', timestampMs: Date.now() });
      paintSquadStatus(squadId, 'Autonomous');
    };
    if (delayMs <= 0) { revert(); return; }
    squadStatusTimers.set(squadId, setTimeout(revert, delayMs));
  }

  function recordSquadStatus(squadId, type, timestampMs) {
    squadStatusState.set(squadId, { type, timestampMs });
    paintSquadStatus(squadId, type);
    if (type === 'Autonomous') {
      if (squadStatusTimers.has(squadId)) { clearTimeout(squadStatusTimers.get(squadId)); squadStatusTimers.delete(squadId); }
      return;
    }
    scheduleAutonomousRevert(squadId, STATUS_HOLD_MS - (Date.now() - timestampMs));
  }

  function resetSquadStatuses() {
    squadStatusTimers.forEach(t => clearTimeout(t));
    squadStatusTimers.clear();
    squadStatusState.clear();
    document.querySelectorAll('.status-side.active').forEach(el => el.classList.remove('active'));
    document.querySelectorAll('.status-label.active').forEach(el => el.classList.remove('active'));
  }

  // Current order shown on each squad tile
  const squadCurrentOrder = new Map();

  function paintSquadOrder(squadId, type) {
    const card = document.querySelector(`.squad-card[data-squad-id="${CSS.escape(squadId)}"]`);
    if (!card) return;
    const el = card.querySelector('.order-current');
    if (!el) return;
    const cls = (ORDER_TYPE_CLASS[type] || '');
    el.className = 'order-current show' + (cls ? ' ' + cls : '');
    el.textContent = t('dashboard.currentOrderPrefix') + orderTypeLabel(type);
  }

  function recordSquadOrder(squadId, type) {
    squadCurrentOrder.set(squadId, type);
    paintSquadOrder(squadId, type);
  }

  function resetSquadOrders() {
    squadCurrentOrder.clear();
    document.querySelectorAll('.order-current.show').forEach(el => { el.className = 'order-current'; el.textContent = ''; });
  }

  const ORDER_TYPES = [
    { type: 'PushBot', cls: 'attack' },
    { type: 'PushMid', cls: 'attack' },
    { type: 'PushTop', cls: 'attack' },
    { type: 'AttackGoose', cls: 'attack' },
    { type: 'KillBoss', cls: 'attack-key' },
    { type: 'Bomb', cls: 'attack-key' },
    { type: 'DefendBot', cls: 'defend' },
    { type: 'DefendMid', cls: 'defend' },
    { type: 'DefendTop', cls: 'defend' },
    { type: 'DefendGoose', cls: 'defend' },
    { type: 'DefendTree', cls: 'defend' },
    { type: 'Hold', cls: 'hold' },
    { type: 'BotJungle', cls: 'jungle' },
    { type: 'TopJungle', cls: 'jungle' }
  ];
  function orderTypeLabel(type) { return t('orderTypes.' + type) || formatLabel(type); }

  // Maps an order type to its color class, reused for the current-order badge on squad tiles.
  const ORDER_TYPE_CLASS = Object.fromEntries(ORDER_TYPES.map(o => [o.type, o.cls]));

  document.getElementById('order-buttons').innerHTML = ORDER_TYPES.map(o =>
    `<button class="order-btn ${o.cls}" onclick="issueOrder('${o.type}')">${orderTypeLabel(o.type)}</button>`
  ).join('');

  // Custom order-type dropdown for macros (replaces the old bare <select>)
  let macroOrderType = ORDER_TYPES[0].type;

  document.getElementById('macro-order-type-menu').innerHTML = ORDER_TYPES.map(o =>
    `<div class="order-type-option ${o.cls}" role="option" data-type="${o.type}" onclick="selectMacroOrderType('${o.type}')">
       <span class="order-type-dot ${o.cls}"></span>${orderTypeLabel(o.type)}
     </div>`
  ).join('');

  function selectMacroOrderType(type) {
    const o = ORDER_TYPES.find(x => x.type === type);
    if (!o) return;
    macroOrderType = type;
    document.getElementById('macro-order-type-label').textContent = orderTypeLabel(type);
    document.getElementById('macro-order-type-dot').className = 'order-type-dot ' + o.cls;
    document.querySelectorAll('#macro-order-type-menu .order-type-option').forEach(el =>
      el.classList.toggle('selected', el.dataset.type === type)
    );
    closeMacroOrderTypeMenu();
  }

  function toggleMacroOrderTypeMenu() {
    const wrap = document.getElementById('macro-order-type-select');
    wrap.classList.toggle('open');
    document.getElementById('macro-order-type-trigger').setAttribute('aria-expanded', wrap.classList.contains('open'));
  }

  function closeMacroOrderTypeMenu() {
    document.getElementById('macro-order-type-select').classList.remove('open');
    document.getElementById('macro-order-type-trigger').setAttribute('aria-expanded', 'false');
  }

  document.addEventListener('click', (e) => {
    const wrap = document.getElementById('macro-order-type-select');
    if (wrap && !wrap.contains(e.target)) closeMacroOrderTypeMenu();
  });

  document.addEventListener('keydown', (e) => {
    if (e.key === 'Escape') closeMacroOrderTypeMenu();
  });

  selectMacroOrderType(ORDER_TYPES[0].type);

  // Order macros

  let macros = [];

  async function refreshMacros() {
    try {
      macros = await connection.invoke("ListOrderMacros");
      renderMacros();
    } catch (err) {
      setStatus(t('dashboard.failedLoadMacros') + err);
    }
  }

  function renderMacros() {
    const el = document.getElementById('macro-list');
    el.dataset.emptyText = t('dashboard.macroListEmpty');
    el.innerHTML = macros.map(m => {
      const targetLabel = (m.squadIds && m.squadIds.length) ? m.squadIds.join(', ') : t('dashboard.allTeams');
      const orderLabel = orderTypeLabel(m.type);
      return `<button class="macro-btn" onclick="runMacro('${m.id}')" title="${orderLabel} → ${targetLabel}">
          ${escapeHtml(m.name)}
          <span class="macro-delete" onclick="event.stopPropagation(); deleteMacro('${m.id}')" title="${t('dashboard.deleteMacroTitle')}">×</span>
        </button>`;
    }).join('');
  }

  function escapeHtml(s) { return s.replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }

  function runMacro(id) {
    connection.invoke("ExecuteOrderMacro", id).catch(err => setStatus(t('dashboard.errorPrefix') + err));
  }

  function deleteMacro(id) {
    const macro = macros.find(m => m.id === id);
    if (!confirm(t('dashboard.deleteMacroConfirm', { name: macro ? macro.name : id }))) return;
    connection.invoke("DeleteOrderMacro", id)
      .then(refreshMacros)
      .catch(err => setStatus(t('dashboard.errorPrefix') + err));
  }

  function saveCurrentAsMacro() {
    const name = document.getElementById('macro-name-input').value.trim();
    if (!name) { setStatus(t('dashboard.giveMacroName')); return; }

    const allSquads = document.getElementById('macro-all-squads').checked;
    if (!allSquads && selectedSquadIds.size === 0) { setStatus(t('dashboard.selectTeamOrCheckAll')); return; }

    const type = macroOrderType;
    const squadIds = allSquads ? [] : [...selectedSquadIds];

    connection.invoke("UpsertOrderMacro", { id: null, name, type, squadIds })
      .then(() => {
        document.getElementById('macro-name-input').value = '';
        document.getElementById('macro-all-squads').checked = false;
        refreshMacros();
      })
      .catch(err => setStatus(t('dashboard.errorPrefix') + err));
  }

  let selectedSquadIds = new Set();

  function persistSelection() {
    localStorage.setItem('gvg_order_targets', JSON.stringify([...selectedSquadIds]));
  }

  function selectSquad(squadId) {

    if (selectedSquadIds.has(squadId)) selectedSquadIds.delete(squadId);
    else selectedSquadIds.add(squadId);
    persistSelection();
    refreshTargetUI();
  }

  function selectAllSquads() {
    document.querySelectorAll('.squad-chip').forEach(chip => selectedSquadIds.add(chip.dataset.squadId));
    persistSelection();
    refreshTargetUI();
  }

  function clearSquadSelection() {
    selectedSquadIds.clear();
    persistSelection();
    refreshTargetUI();
  }

  // Flex teams count as Defense for this filter.
  function squadSideMatches(side, filterSide) {
    const effective = side === 'Flex' ? 'Defense' : side;
    return effective === filterSide;
  }

  function selectSideSquads(filterSide) {
    selectedSquadIds.clear();
    document.querySelectorAll('.squad-chip').forEach(chip => {
      if (squadSideMatches(chip.dataset.side, filterSide)) selectedSquadIds.add(chip.dataset.squadId);
    });
    persistSelection();
    refreshTargetUI();
  }

  function refreshTargetUI() {
    const label = selectedSquadIds.size
      ? [...selectedSquadIds].sort().join(', ')
      : t('dashboard.noneSelected');
    document.getElementById('order-target-value').textContent = label;
    document.querySelectorAll('.squad-chip').forEach(chip => {
      const isSelected = selectedSquadIds.has(chip.dataset.squadId);
      chip.classList.toggle('selected', isSelected);
    });
    document.querySelectorAll('.squad-card').forEach(card =>
      card.classList.toggle('targeted', selectedSquadIds.has(card.dataset.squadId)));
    document.getElementById('order-buttons').classList.toggle('disabled', selectedSquadIds.size === 0);
  }

  function issueOrder(type) {
    if (selectedSquadIds.size === 0) { setStatus(t('dashboard.selectTeamFirst')); return; }
    connection.invoke("IssueOrder", { type, targetSquadIds: [...selectedSquadIds] })
      .catch(err => setStatus(t('dashboard.errorPrefix') + err));
  }

  // Goal orders — free-text callouts targeted by build/role/side/phase instead of squad.
  function readGoalOrderTarget() {
    const buildsRaw = document.getElementById('goal-order-builds').value.trim();
    const builds = buildsRaw ? buildsRaw.split(',').map(b => b.trim()).filter(Boolean) : null;
    const roles = [...document.querySelectorAll('.goal-role-cb:checked')].map(cb => cb.value);
    const sides = [...document.querySelectorAll('.goal-side-cb:checked')].map(cb => cb.value);
    return {
      builds: builds && builds.length ? builds : null,
      roles: roles.length ? roles : null,
      sides: sides.length ? sides : null,
      squadIds: null
    };
  }

  function readGoalOrderPhase() {
    const v = document.getElementById('goal-order-phase').value;
    return v || null;
  }

  function readGoalOrderTimer() {
    const v = document.getElementById('goal-order-timer').value;
    return v ? Number(v) : null;
  }

  function issueGoalOrder() {
    const text = document.getElementById('goal-order-text').value.trim();
    if (!text) { setStatus('Write the goal order text first.'); return; }
    connection.invoke("IssueGoalOrder", { text, target: readGoalOrderTarget(), timerSeconds: readGoalOrderTimer(), phase: readGoalOrderPhase() })
      .catch(err => setStatus(t('dashboard.errorPrefix') + err));
  }

  let goalMacros = [];

  function refreshGoalMacros() {
    connection.invoke("ListGoalOrderMacros").then(list => { goalMacros = list; renderGoalMacros(); }).catch(() => {});
  }

  function renderGoalMacros() {
    const el = document.getElementById('goal-macro-list');
    el.innerHTML = goalMacros.map(m => `
      <span class="gop-macro-btn">
        <button onclick="executeGoalMacro('${m.id}')" title="${escapeHtmlAttr(m.text)}" style="all:unset; cursor:pointer;">${escapeHtmlAttr(m.name)}</button>
        <button class="gop-macro-delete" onclick="deleteGoalMacro('${m.id}')" title="Delete macro">×</button>
      </span>
    `).join('');
  }

  function escapeHtmlAttr(s) {
    return (s || '').replace(/&/g, '&amp;').replace(/"/g, '&quot;').replace(/</g, '&lt;');
  }

  function saveCurrentGoalAsMacro() {
    const name = document.getElementById('goal-macro-name').value.trim();
    const text = document.getElementById('goal-order-text').value.trim();
    if (!name || !text) { setStatus('Need both a macro name and goal order text to save.'); return; }
    connection.invoke("UpsertGoalOrderMacro", {
      id: null, name, text, target: readGoalOrderTarget(), timerSeconds: readGoalOrderTimer(), phase: readGoalOrderPhase()
    }).then(() => { document.getElementById('goal-macro-name').value = ''; refreshGoalMacros(); })
      .catch(err => setStatus(t('dashboard.errorPrefix') + err));
  }

  function executeGoalMacro(id) {
    connection.invoke("ExecuteGoalOrderMacro", id).catch(err => setStatus(t('dashboard.errorPrefix') + err));
  }

  function deleteGoalMacro(id) {
    connection.invoke("DeleteGoalOrderMacro", id).then(refreshGoalMacros).catch(err => setStatus(t('dashboard.errorPrefix') + err));
  }

  function enemyRoleLabel(evt) {
    if (evt.enemyRole) return t('observer.enemyRoles.' + evt.enemyRole) || evt.enemyRole;
    return evt.note ?? t('player.eventFallback');
  }

  connection.onreconnecting(() => setStatus(t('common.reconnecting')));
  connection.onreconnected(() => { setStatus(t('common.connected')); refreshMacros(); refreshGoalMacros(); });

  connection.on("BattleEvent", evt =>
    addItem(alertClass(evt), `${enemyRoleLabel(evt)} → ${evt.targetSquadId}`, evt.reporterName, evt.timestamp));

  connection.on("OrderIssued", order => {
    addItem(orderClass(order.type), `${t('dashboard.orderWord')} ${orderTypeLabel(order.type)} → ${order.targetSquadId}`, order.issuerName, order.issuedAt);
    recordSquadOrder(order.targetSquadId, order.type);
  });

  connection.on("GoalOrderIssued", order =>
    addItem('order-item', `GOAL: "${order.text}"`, order.issuerName, order.issuedAt));

  connection.on("SquadStatusChanged", status => {
    addItem(statusClass(status.type), `${t('dashboard.statusWord')} ${t('statusTypes.' + status.type) || formatLabel(status.type)} → ${status.targetSquadId}`, status.reporterName, status.timestamp);
    recordSquadStatus(status.targetSquadId, status.type, new Date(status.timestamp).getTime());
  });

  connection.on("RosterUpdated", roster => renderRoster(roster));

  connection.on("HistoryReset", () => { feed.innerHTML = ''; resetSquadStatuses(); resetSquadOrders(); });

  connection.on("BattleStatusChanged", status => renderBattleStatus(status));

  connection.on("SpawnReminder", showSpawnToast);

  // Online/offline presence
  let onlineUsernames = new Set();

  connection.on("OnlineUsernames", names => {
    onlineUsernames = new Set(names);
    paintAllPresence();
  });

  connection.on("PresenceChanged", p => {
    if (p.online) onlineUsernames.add(p.username); else onlineUsernames.delete(p.username);
    paintPresence(p.username);
  });

  function paintPresence(username) {
    document.querySelectorAll(`.presence-dot[data-username="${CSS.escape(username)}"]`).forEach(dot => {
      dot.classList.toggle('online', onlineUsernames.has(username));
    });
  }

  function paintAllPresence() {
    document.querySelectorAll('.presence-dot').forEach(dot => {
      dot.classList.toggle('online', onlineUsernames.has(dot.dataset.username));
    });
  }

  let spawnToastTimer = null;

  const ST_ICON_BOSS = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M12 3.2c-4.4 0-7.8 3.3-7.8 7.7 0 2.6 1.2 4.8 3 6.2v2.1c0 .55.45 1 1 1H9v-1.8h1.1v1.8h1.8v-1.8H13v1.8h0.8c.55 0 1-.45 1-1v-2.1c1.8-1.4 3-3.6 3-6.2 0-4.4-3.4-7.7-7.8-7.7Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="9" cy="11" r="1.3" fill="currentColor"/><circle cx="15" cy="11" r="1.3" fill="currentColor"/></svg>';
  const ST_ICON_JUNGLE = '<svg viewBox="0 0 24 24" width="17" height="17" fill="none"><path d="M12 21s-6.5-4.3-6.5-9.8a6.5 6.5 0 0 1 13 0c0 5.5-6.5 9.8-6.5 9.8Z" stroke="currentColor" stroke-width="1.5" stroke-linejoin="round"/><circle cx="12" cy="11" r="2.3" stroke="currentColor" stroke-width="1.5"/></svg>';

  function showSpawnToast(reminder) {
    const el = document.getElementById('spawn-toast');
    const isBoss = reminder.kind === 'Boss';
    let text;
    if (isBoss) {
      text = t('player.bossSpawning');
    } else {
      const tags = (reminder.tags && reminder.tags.length) ? reminder.tags : ['Jungle'];
      const label = tags.map(tag => t('jungleTags.' + tag) || t('jungleTags.Jungle')).join(t('player.and'));
      const prefix = reminder.targetSquadId ? `${reminder.targetSquadId}: ` : '';
      text = `${prefix}${label}${t('player.spawningSuffix')}`;
    }
    el.innerHTML = `<span class="st-icon">${isBoss ? ST_ICON_BOSS : ST_ICON_JUNGLE}</span><span class="st-text"></span><span class="st-bar"></span>`;
    el.querySelector('.st-text').textContent = text;
    el.classList.toggle('kind-Boss', isBoss);
    el.classList.remove('show');
    void el.offsetWidth;
    el.classList.add('show');
    if (spawnToastTimer) clearTimeout(spawnToastTimer);
    spawnToastTimer = setTimeout(() => el.classList.remove('show'), 8000);
  }


  connection.on("Snapshot", items => items.forEach(renderHistoryItem));

  function renderHistoryItem(i) {
    if ('eventId' in i) addItem(alertClass(i), `${enemyRoleLabel(i)} → ${i.targetSquadId}`, i.reporterName, i.timestamp);
    else if ('goalOrderId' in i) addItem('order-item', `GOAL: "${i.text}"`, i.issuerName, i.issuedAt);
    else if ('orderId' in i) {
      addItem(orderClass(i.type), `${t('dashboard.orderWord')} ${orderTypeLabel(i.type)} → ${i.targetSquadId}`, i.issuerName, i.issuedAt);
      recordSquadOrder(i.targetSquadId, i.type);
    }
    else {
      addItem(statusClass(i.type), `${t('dashboard.statusWord')} ${t('statusTypes.' + i.type) || formatLabel(i.type)} → ${i.targetSquadId}`, i.reporterName, i.timestamp);
      recordSquadStatus(i.targetSquadId, i.type, new Date(i.timestamp).getTime());
    }
  }

  // Enemy reports
  function alertClass(evt) {
    return evt.enemyRole != null ? 'Critical' : evt.severity;
  }

  connection.start()
    .then(() => { setStatus(t('common.connected')); refreshMacros(); refreshGoalMacros(); })
    .catch(err => setStatus(t('common.connectionFailed') + err));

  const RESERVE_SQUAD_ID = 'RESERVE';

  function renderRoster(fullRoster) {
    fullRoster = fullRoster || [];
    const roster = fullRoster.filter(sq => sq.squadId !== RESERVE_SQUAD_ID);
    const reserveSquad = fullRoster.find(sq => sq.squadId === RESERVE_SQUAD_ID);

    // Drop any previously-selected squads that no longer exist in the roster
    selectedSquadIds = new Set([...selectedSquadIds].filter(id => roster.some(sq => sq.squadId === id)));

    if (selectedSquadIds.size === 0) {
      let saved = [];
      try { saved = JSON.parse(localStorage.getItem('gvg_order_targets') || '[]'); } catch { saved = []; }
      const validSaved = saved.filter(id => roster.some(sq => sq.squadId === id));
      if (validSaved.length) selectedSquadIds = new Set(validSaved);
      else if (roster.length === 1) selectedSquadIds = new Set([roster[0].squadId]);
    }

    const chips = document.getElementById('order-squad-chips');
    chips.innerHTML = roster.map(sq =>
      `<button class="squad-chip" data-squad-id="${sq.squadId}" data-side="${sq.side}" onclick="selectSquad('${sq.squadId}')"><span class="chip-check">✓</span>${sq.squadId}</button>`
    ).join('');

    const el = document.getElementById('roster');
    el.innerHTML = '';
    roster.forEach(sq => {
      const card = document.createElement('div');
      card.className = 'squad-card ' + sq.side;
      card.dataset.squadId = sq.squadId;
      card.onclick = () => selectSquad(sq.squadId);

      const h4 = document.createElement('h4');
      const sideLabel = t('dashboard.sides.' + sq.side) || sq.side;
      h4.textContent = `${sq.squadId} · ${sideLabel}${sq.label ? ' · ' + sq.label : ''}`;
      (sq.tags || []).forEach(tag => {
        const tagEl = document.createElement('span');
        tagEl.className = 'tag-badge';
        tagEl.textContent = t('dashboard.tagLabels.' + tag) || tag;
        tagEl.style.marginLeft = '6px';
        h4.appendChild(tagEl);
      });

      const membersEl = document.createElement('div');
      membersEl.className = 'members';
      const members = sq.members || [];

      let warnEl = null;
      const hasTank = members.some(m => m.role === 'Tank');
      const hasHealer = members.some(m => m.role === 'Healer');
      if (members.length > 0 && (!hasTank || !hasHealer)) {
        const missing = [];
        if (!hasHealer) missing.push(t('dashboard.missingHealer'));
        if (!hasTank) missing.push(t('dashboard.missingTank'));
        warnEl = document.createElement('div');
        warnEl.className = 'comp-warning';
        warnEl.textContent = `${t('dashboard.noRolePrefix')}${missing.join(' / ')}`;
      }

      if (members.length === 0) {
        membersEl.textContent = '-';
      } else {
        members.forEach(m => {
          const row = document.createElement('div');
          row.className = 'member-row';

          const nameEl = document.createElement('span');
          nameEl.textContent = m.nickname;
          row.appendChild(nameEl);

          const presenceDot = document.createElement('span');
          presenceDot.className = 'presence-dot' + (onlineUsernames.has(m.nickname) ? ' online' : '');
          presenceDot.dataset.username = m.nickname;
          presenceDot.title = onlineUsernames.has(m.nickname) ? t('dashboard.online') : t('dashboard.offline');
          row.appendChild(presenceDot);

          if (m.role) {
            const roleEl = document.createElement('span');
            roleEl.className = 'role-badge ' + m.role;
            roleEl.textContent = t('menu.roles.' + m.role) || m.role.toUpperCase();
            row.appendChild(roleEl);
          }
          if (m.bulwark && m.bulwark !== 'None') {
            const bwSymbol = { Top: '♜↑', Center: '♜', Bottom: '♜↓' }[m.bulwark] || '♜';
            const bwEl = document.createElement('span');
            bwEl.className = 'bulwark-badge';
            bwEl.title = t('menu.bulwark.' + m.bulwark) || (m.bulwark + ' bulwark');
            bwEl.textContent = bwSymbol;
            row.appendChild(bwEl);
          }
          membersEl.appendChild(row);
        });
      }

      const orderCurrent = document.createElement('div');
      orderCurrent.className = 'order-current';

      const statusSide = document.createElement('div');
      statusSide.className = 'status-side';

      const statusLabel = document.createElement('div');
      statusLabel.className = 'status-label';
      const statusDot = document.createElement('span');
      statusDot.className = 'status-dot';
      const statusText = document.createElement('span');
      statusText.className = 'status-text';
      statusLabel.append(statusDot, statusText);

      card.append(h4);
      if (warnEl) card.append(warnEl);
      card.append(membersEl, orderCurrent, statusLabel, statusSide);
      el.appendChild(card);
    });

    renderReserves(reserveSquad);
    refreshTargetUI();


    squadStatusState.forEach((state, squadId) => paintSquadStatus(squadId, state.type));
    squadCurrentOrder.forEach((type, squadId) => paintSquadOrder(squadId, type));
  }

  function renderReserves(reserveSquad) {
    const section = document.getElementById('reserves-section');
    const members = (reserveSquad && reserveSquad.members) || [];
    if (members.length === 0) { section.innerHTML = ''; return; }

    const card = document.createElement('div');
    card.className = 'reserve-card';

    const h4 = document.createElement('h4');
    h4.textContent = t('dashboard.reservesCount', { count: members.length });
    card.appendChild(h4);

    const membersEl = document.createElement('div');
    membersEl.className = 'members';
    members.forEach(m => {
      const row = document.createElement('div');
      row.className = 'member-row';

      const nameEl = document.createElement('span');
      nameEl.textContent = m.nickname;
      row.appendChild(nameEl);

      const presenceDot = document.createElement('span');
      presenceDot.className = 'presence-dot' + (onlineUsernames.has(m.nickname) ? ' online' : '');
      presenceDot.dataset.username = m.nickname;
      presenceDot.title = onlineUsernames.has(m.nickname) ? t('dashboard.online') : t('dashboard.offline');
      row.appendChild(presenceDot);

      if (m.role) {
        const roleEl = document.createElement('span');
        roleEl.className = 'role-badge ' + m.role;
        roleEl.textContent = t('menu.roles.' + m.role) || m.role.toUpperCase();
        row.appendChild(roleEl);
      }
      if (m.bulwark && m.bulwark !== 'None') {
        const bwSymbol = { Top: '♜↑', Center: '♜', Bottom: '♜↓' }[m.bulwark] || '♜';
        const bwEl = document.createElement('span');
        bwEl.className = 'bulwark-badge';
        bwEl.title = t('menu.bulwark.' + m.bulwark) || (m.bulwark + ' bulwark');
        bwEl.textContent = bwSymbol;
        row.appendChild(bwEl);
      }
      membersEl.appendChild(row);
    });

    card.appendChild(membersEl);
    section.innerHTML = '';
    section.appendChild(card);
  }

  function setStatus(text) {
    document.getElementById('status').textContent = text;
    const hudStatus = document.getElementById('hud-status');
    if (hudStatus) hudStatus.textContent = text;
  }

  function startBattleFromDashboard() {
    connection.invoke("StartBattle")
      .then(() => setStatus(`${t('common.connected')} · ${t('dashboard.battleStarted')}`))
      .catch(err => setStatus(`${t('common.connected')} · ${t('dashboard.errorPrefix')}${err}`));
  }

  function endBattleFromDashboard() {
    if (!confirm(t('dashboard.endBattleConfirm'))) return;
    connection.invoke("EndBattle")
      .then(() => setStatus(`${t('common.connected')} · ${t('dashboard.battleEnded')}`))
      .catch(err => setStatus(`${t('common.connected')} · ${t('dashboard.errorPrefix')}${err}`));
  }

  let battleStartedAt = null;
  let battleClockTimer = null;

  function renderBattleStatus(status) {
    const el = document.getElementById('battle-status');
    clearInterval(battleClockTimer);

    if (status && status.isActive) {
      battleStartedAt = new Date(status.startedAt);
      const update = () => { el.textContent = t('dashboard.battleInProgressSince', { time: battleStartedAt.toLocaleTimeString() }); };
      update();
      battleClockTimer = setInterval(update, 30000);
      el.classList.add('active');
      el.classList.remove('inactive');
    } else {
      battleStartedAt = null;
      el.textContent = t('menu.stats.noActiveBattle');
      el.classList.add('inactive');
      el.classList.remove('active');
    }
  }

  function addItem(cls, title, who, ts) {
    const div = document.createElement('div');
    div.className = 'feed-item ' + cls;

    const titleEl = document.createElement('div');
    titleEl.className = 'title';
    titleEl.textContent = title;

    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.textContent = `${who} · ${new Date(ts).toLocaleTimeString()}`;

    div.append(titleEl, metaEl);
    feed.prepend(div);
  }


  TacnetHud.init({
    hoverSelectors: [
      '#hud-controls .menu-nav-btn', '#hud-controls .logout-btn',
      '#battle-controls button', '#order-panel button', '#order-panel .squad-chip',
      '#goal-order-panel textarea', '#goal-order-panel input', '#goal-order-panel select', '#goal-order-panel button',
      '#roster .squad-card',
    ],
    storageKey: 'tacnet_layout_dashboard_v1',
    widgets: [
      { key: 'battleStatus', get: () => document.getElementById('battle-status'), label: 'Battle status' },
      { key: 'battleControls', get: () => document.getElementById('battle-controls'), label: 'Start/End battle' },
      { key: 'orderPanel', get: () => document.getElementById('order-panel'), label: 'Issue order' },
      { key: 'goalOrderPanel', get: () => document.getElementById('goal-order-panel'), label: 'Issue goal order' },
      { key: 'feedSection', get: () => document.getElementById('feed-section'), label: 'Event feed' },
      { key: 'roster', get: () => document.getElementById('roster'), label: 'Teams' },
      { key: 'spawnToast', get: () => document.getElementById('spawn-toast'), label: 'Spawn notice' },
      { key: 'hudControls', get: () => document.getElementById('hud-controls'), label: 'Menu buttons' },
    ],
  });
</script>
</body>
</html>
