<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GvG - Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script src="/js/auth.js"></script>
<style>
  body { background:#0b0b0b; color:#eee; font-family: system-ui, sans-serif; padding: 20px; max-width: 720px; margin: 0 auto; }
  h2 { margin-bottom: 2px; }
  #status { color:#666; font-size:12px; margin-bottom: 4px; }
  #battle-status { font-size:13px; font-weight:600; margin-bottom: 18px; padding: 8px 12px; border-radius: 6px; display:inline-block; }
  #battle-status.active   { background:#1a2e1a; color:#7dd87d; }
  #battle-status.inactive { background:#2a2a2a; color:#999; }
  .feed-item {
    padding: 12px 14px; margin-bottom: 8px; border-radius: 8px;
    border-left: 4px solid #555; background:#1a1a1a;
  }
  .Critical { border-left-color:#e33; }
  .Warning  { border-left-color:#e8a33d; }
  .Info     { border-left-color:#3d8ee8; }
  .order-item { border-left-color:#8a4de8; }
  .cat-critical    { border-left-color:#6e1c1c; }
  .cat-attack      { border-left-color:#c1622b; }
  .cat-attack-key  { border-left-color:#e8790f; }
  .cat-defend      { border-left-color:#4c7a4f; }
  .cat-hold        { border-left-color:#2e5230; }
  .cat-protect     { border-left-color:#4fae82; }
  .cat-tactic      { border-left-color:#2f6fb2; }
  .cat-fallback    { border-left-color:#4a90c4; }
  .cat-jungle      { border-left-color:#1e3a5f; }
  .title { font-weight: 600; font-size: 15px; }
  .meta { color:#888; font-size:12px; margin-top: 3px; }
  #roster { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 10px; }
  #reserves-section { margin-bottom: 24px; }
  #reserves-section h4 { margin: 0 0 6px 0; font-size: 12px; color: #888; text-transform: uppercase; letter-spacing: 0.05em; }
  #reserves-section:empty { display: none; }
  .reserve-card { background:#161616; border-radius:8px; padding:10px 12px; border-left: 3px solid #555; }
  .squad-card { background:#161616; border-radius:8px; padding:10px 12px; }
  .squad-card h4 { margin:0 0 4px 0; font-size:13px; color:#aaa; }
  .squad-card .members { font-size:13px; color:#ccc; display: flex; flex-direction: column; gap: 4px; }
  .member-row { display: flex; align-items: center; gap: 6px; flex-wrap: wrap; }
  .role-badge { font-size: 10px; font-weight: 700; padding: 1px 6px; border-radius: 4px; }
  .role-badge.Dps { background: #3a1a1a; color: #e88a8a; }
  .role-badge.Tank { background: #1a2a3a; color: #7dc0e8; }
  .role-badge.Healer { background: #1a3a1a; color: #7dd87d; }
  .tag-badge { font-size: 10px; padding: 1px 6px; border-radius: 4px; background: #2a2a2a; color: #999; }
  .bulwark-badge { font-size: 12px; }
  .squad-card.Defense { border-left: 3px solid #3d8ee8; }
  .squad-card.Attack  { border-left: 3px solid #e8a33d; }
  .squad-card.Flex    { border-left: 3px solid #8a4de8; }
  .menu-nav-btn { font-size: 12px; padding: 6px 12px; background: #333; border: none; border-radius: 4px; color: #fff; cursor: pointer; text-decoration: none; margin-right: 8px; }
  #order-panel { margin-bottom: 20px; background: #161616; border-radius: 8px; padding: 14px; }
  #order-panel h4 { margin: 0 0 10px 0; font-size: 13px; color: #aaa; text-transform: uppercase; letter-spacing: 0.05em; }
  #order-target-label { font-size: 12px; color: #888; margin-bottom: 8px; }
  #order-target-label strong { color: #eee; }
  #order-squad-chips { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 12px; }
  .squad-chip {
    font-size: 13px; font-weight: 700; padding: 8px 14px; border-radius: 999px;
    border: 2px solid #3a3a3a; background: #202020; color: #bbb; cursor: pointer;
  }
  .squad-chip:active { transform: scale(0.96); }
  .squad-chip.selected { border-color: #eee; background: #2f6fb2; color: #fff; }
  #order-buttons { display: flex; flex-wrap: wrap; gap: 8px; }
  #order-buttons.disabled { opacity: 0.4; pointer-events: none; }
  .order-btn { font-size: 13px; padding: 8px 12px; border: none; border-radius: 6px; color: #fff; cursor: pointer; font-weight: 600; }
  .order-btn:active { transform: scale(0.97); }
  .order-btn.attack     { background: #c1622b; }
  .order-btn.attack-key { background: #e8790f; }
  .order-btn.defend     { background: #4c7a4f; }
  .order-btn.hold       { background: #2e5230; }
  .order-btn.protect    { background: #4fae82; }
  .order-btn.tactic     { background: #2f6fb2; }
  .order-btn.fallback   { background: #4a90c4; }
  .order-btn.jungle     { background: #1e3a5f; }
  .squad-card { cursor: pointer; border: 2px solid transparent; }
  .squad-card.targeted { border-color: #eee; }
</style>
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
    <h2 style="margin: 0;">Main Commander. Live Feed</h2>
    <a class="menu-nav-btn" href="/menu.html">Menu</a>
    <button onclick="logout()" style="font-size: 12px; padding: 6px 12px; background: #333; border: none; border-radius: 4px; color: #fff; cursor: pointer;">Log out</button>
  </div>
  <div id="status">connecting...</div>
  <div id="battle-status" class="inactive">No active battle</div>

  <div id="order-panel">
    <h4>Issue order</h4>
    <div id="order-target-label">Target: <strong id="order-target-value">none selected</strong></div>
    <div id="order-squad-chips"></div>
    <div id="order-buttons" class="disabled"></div>
  </div>

  <div id="roster"></div>
  <div id="reserves-section"></div>
  <div id="feed"></div>

<script>
  const currentUser = requireAuth(['Commander', 'Admin']);

  const connection = new signalR.HubConnectionBuilder()
    .withUrl("/battleHub?access_token=" + encodeURIComponent(currentUser.token))
    .withAutomaticReconnect()
    .build();

  const feed = document.getElementById('feed');

  const ORDER_CATEGORIES = {
    SquadWiped: 'critical',
    PushBot: 'attack', PushMid: 'attack', PushTop: 'attack', AttackGoose: 'attack',
    KillBoss: 'attack-key', Bomb: 'attack-key',
    DefendBot: 'defend', DefendMid: 'defend', DefendTop: 'defend', DefendGoose: 'defend', DefendTree: 'defend',
    Hold: 'hold',
    ProtectHealer: 'protect',
    Rotate: 'tactic',
    FallBack: 'fallback',
    BotJungle: 'jungle', TopJungle: 'jungle'
  };
  function orderClass(type) {
    const category = ORDER_CATEGORIES[type];
    return category ? 'cat-' + category : 'order-item';
  }

  const STATUS_CLASSES = {
    SquadWiped: 'cat-critical', Regrouped: 'cat-defend', NeedHealing: 'cat-protect',
    Retreating: 'cat-fallback', ObjectiveSecured: 'cat-attack-key'
  };
  function statusClass(type) { return STATUS_CLASSES[type] || 'order-item'; }

  const ORDER_TYPES = [
    { type: 'PushBot', label: 'PUSH BOT', cls: 'attack' },
    { type: 'PushMid', label: 'PUSH MID', cls: 'attack' },
    { type: 'PushTop', label: 'PUSH TOP', cls: 'attack' },
    { type: 'AttackGoose', label: 'ATTACK GOOSE', cls: 'attack' },
    { type: 'KillBoss', label: 'KILL BOSS', cls: 'attack-key' },
    { type: 'Bomb', label: 'BOMB', cls: 'attack-key' },
    { type: 'DefendBot', label: 'DEFEND BOT', cls: 'defend' },
    { type: 'DefendMid', label: 'DEFEND MID', cls: 'defend' },
    { type: 'DefendTop', label: 'DEFEND TOP', cls: 'defend' },
    { type: 'DefendGoose', label: 'DEFEND GOOSE', cls: 'defend' },
    { type: 'DefendTree', label: 'DEFEND TREE', cls: 'defend' },
    { type: 'Hold', label: 'HOLD', cls: 'hold' },
    { type: 'ProtectHealer', label: 'PROTECT HEALER', cls: 'protect' },
    { type: 'Rotate', label: 'ROTATE', cls: 'tactic' },
    { type: 'FallBack', label: 'FALL BACK', cls: 'fallback' },
    { type: 'BotJungle', label: 'BOT JUNGLE', cls: 'jungle' },
    { type: 'TopJungle', label: 'TOP JUNGLE', cls: 'jungle' }
  ];

  document.getElementById('order-buttons').innerHTML = ORDER_TYPES.map(o =>
    `<button class="order-btn ${o.cls}" onclick="issueOrder('${o.type}')">${o.label}</button>`
  ).join('');

  let selectedSquadId = null;

  function selectSquad(squadId) {
    selectedSquadId = squadId;
    localStorage.setItem('gvg_order_target', squadId);
    refreshTargetUI();
  }

  function refreshTargetUI() {
    document.getElementById('order-target-value').textContent = selectedSquadId || 'none selected';
    document.querySelectorAll('.squad-chip').forEach(chip =>
      chip.classList.toggle('selected', chip.dataset.squadId === selectedSquadId));
    document.querySelectorAll('.squad-card').forEach(card =>
      card.classList.toggle('targeted', card.dataset.squadId === selectedSquadId));
    document.getElementById('order-buttons').classList.toggle('disabled', !selectedSquadId);
  }

  function issueOrder(type) {
    if (!selectedSquadId) { setStatus('Select a squad first'); return; }
    connection.invoke("IssueOrder", { type, targetSquadId: selectedSquadId })
      .catch(err => setStatus("Error: " + err));
  }

  connection.onreconnecting(() => setStatus("reconnecting..."));
  connection.onreconnected(() => setStatus("connected"));

  connection.on("BattleEvent", evt =>
    addItem(alertClass(evt), `${evt.enemyRole ?? evt.note ?? 'EVENT'} → ${evt.targetSquadId}`, evt.reporterName, evt.timestamp));

  connection.on("OrderIssued", order =>
    addItem(orderClass(order.type), `ORDER ${order.type} → ${order.targetSquadId}`, order.issuerName, order.issuedAt));

  connection.on("SquadStatusChanged", status =>
    addItem(statusClass(status.type), `STATUS ${status.type} → ${status.targetSquadId}`, status.reporterName, status.timestamp));

  connection.on("RosterUpdated", roster => renderRoster(roster));

  connection.on("HistoryReset", () => { feed.innerHTML = ''; });

  connection.on("BattleStatusChanged", status => renderBattleStatus(status));


  connection.on("Snapshot", items => items.forEach(renderHistoryItem));

  function renderHistoryItem(i) {
    if ('eventId' in i) addItem(alertClass(i), `${i.enemyRole ?? i.note ?? 'EVENT'} → ${i.targetSquadId}`, i.reporterName, i.timestamp);
    else if ('orderId' in i) addItem(orderClass(i.type), `ORDER ${i.type} → ${i.targetSquadId}`, i.issuerName, i.issuedAt);
    else addItem(statusClass(i.type), `STATUS ${i.type} → ${i.targetSquadId}`, i.reporterName, i.timestamp);
  }

  // Репорты врага 
  function alertClass(evt) {
    return evt.enemyRole != null ? 'Critical' : evt.severity;
  }

  connection.start()
    .then(() => setStatus("connected"))
    .catch(err => setStatus("connection failed: " + err));

  const RESERVE_SQUAD_ID = 'RESERVE';

  function renderRoster(fullRoster) {
    fullRoster = fullRoster || [];
    const roster = fullRoster.filter(sq => sq.squadId !== RESERVE_SQUAD_ID);
    const reserveSquad = fullRoster.find(sq => sq.squadId === RESERVE_SQUAD_ID);

    // если выбранный отряд пропал из ростера - сбрасываем выбор
    if (selectedSquadId && !roster.some(sq => sq.squadId === selectedSquadId)) {
      selectedSquadId = null;
    }
    // при первой загрузке восстанавливаем последний выбранный отряд или берём первый
    if (!selectedSquadId) {
      const saved = localStorage.getItem('gvg_order_target');
      if (saved && roster.some(sq => sq.squadId === saved)) selectedSquadId = saved;
      else if (roster.length === 1) selectedSquadId = roster[0].squadId;
    }

    const chips = document.getElementById('order-squad-chips');
    chips.innerHTML = roster.map(sq =>
      `<button class="squad-chip" data-squad-id="${sq.squadId}" onclick="selectSquad('${sq.squadId}')">${sq.squadId}</button>`
    ).join('');

    const el = document.getElementById('roster');
    el.innerHTML = '';
    roster.forEach(sq => {
      const card = document.createElement('div');
      card.className = 'squad-card ' + sq.side;
      card.dataset.squadId = sq.squadId;
      card.onclick = () => selectSquad(sq.squadId);

      const h4 = document.createElement('h4');
      h4.textContent = `${sq.squadId} · ${sq.side}${sq.label ? ' · ' + sq.label : ''}`;
      (sq.tags || []).forEach(tag => {
        const tagEl = document.createElement('span');
        tagEl.className = 'tag-badge';
        tagEl.textContent = tag;
        tagEl.style.marginLeft = '6px';
        h4.appendChild(tagEl);
      });

      const membersEl = document.createElement('div');
      membersEl.className = 'members';
      const members = sq.members || [];
      if (members.length === 0) {
        membersEl.textContent = '-';
      } else {
        members.forEach(m => {
          const row = document.createElement('div');
          row.className = 'member-row';

          const nameEl = document.createElement('span');
          nameEl.textContent = m.nickname;
          row.appendChild(nameEl);

          if (m.role) {
            const roleEl = document.createElement('span');
            roleEl.className = 'role-badge ' + m.role;
            roleEl.textContent = m.role.toUpperCase();
            row.appendChild(roleEl);
          }
          if (m.bulwark && m.bulwark !== 'None') {
            const bwSymbol = { Top: '♜↑', Center: '♜', Bottom: '♜↓' }[m.bulwark] || '♜';
            const bwEl = document.createElement('span');
            bwEl.className = 'bulwark-badge';
            bwEl.title = m.bulwark + ' bulwark';
            bwEl.textContent = bwSymbol;
            row.appendChild(bwEl);
          }
          membersEl.appendChild(row);
        });
      }

      card.append(h4, membersEl);
      el.appendChild(card);
    });

    renderReserves(reserveSquad);
    refreshTargetUI();
  }

  function renderReserves(reserveSquad) {
    const section = document.getElementById('reserves-section');
    const members = (reserveSquad && reserveSquad.members) || [];
    if (members.length === 0) { section.innerHTML = ''; return; }

    const card = document.createElement('div');
    card.className = 'reserve-card';

    const h4 = document.createElement('h4');
    h4.textContent = `Reserves (${members.length})`;
    card.appendChild(h4);

    const membersEl = document.createElement('div');
    membersEl.className = 'members';
    members.forEach(m => {
      const row = document.createElement('div');
      row.className = 'member-row';

      const nameEl = document.createElement('span');
      nameEl.textContent = m.nickname;
      row.appendChild(nameEl);

      if (m.role) {
        const roleEl = document.createElement('span');
        roleEl.className = 'role-badge ' + m.role;
        roleEl.textContent = m.role.toUpperCase();
        row.appendChild(roleEl);
      }
      if (m.bulwark && m.bulwark !== 'None') {
        const bwSymbol = { Top: '♜↑', Center: '♜', Bottom: '♜↓' }[m.bulwark] || '♜';
        const bwEl = document.createElement('span');
        bwEl.className = 'bulwark-badge';
        bwEl.title = m.bulwark + ' bulwark';
        bwEl.textContent = bwSymbol;
        row.appendChild(bwEl);
      }
      membersEl.appendChild(row);
    });

    card.appendChild(membersEl);
    section.innerHTML = '';
    section.appendChild(card);
  }

  function setStatus(text) {
    document.getElementById('status').textContent = text;
  }

  let battleStartedAt = null;
  let battleClockTimer = null;

  function renderBattleStatus(status) {
    const el = document.getElementById('battle-status');
    clearInterval(battleClockTimer);

    if (status && status.isActive) {
      battleStartedAt = new Date(status.startedAt);
      const update = () => { el.textContent = `Battle in progress since ${battleStartedAt.toLocaleTimeString()}`; };
      update();
      battleClockTimer = setInterval(update, 30000);
      el.className = 'active';
    } else {
      battleStartedAt = null;
      el.textContent = 'No active battle';
      el.className = 'inactive';
    }
  }

  function addItem(cls, title, who, ts) {
    const div = document.createElement('div');
    div.className = 'feed-item ' + cls;

    const titleEl = document.createElement('div');
    titleEl.className = 'title';
    titleEl.textContent = title;

    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.textContent = `${who} · ${new Date(ts).toLocaleTimeString()}`;

    div.append(titleEl, metaEl);
    feed.prepend(div);
  }
</script>
</body>
</html>
