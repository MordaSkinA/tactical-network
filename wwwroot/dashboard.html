<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GvG — Dashboard</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script src="/js/auth.js"></script>
<style>
  body { background:#0b0b0b; color:#eee; font-family: system-ui, sans-serif; padding: 20px; max-width: 720px; margin: 0 auto; }
  h2 { margin-bottom: 2px; }
  #status { color:#666; font-size:12px; margin-bottom: 18px; }
  .feed-item {
    padding: 12px 14px; margin-bottom: 8px; border-radius: 8px;
    border-left: 4px solid #555; background:#1a1a1a;
  }
  .Critical { border-left-color:#e33; }
  .Warning  { border-left-color:#e8a33d; }
  .Info     { border-left-color:#3d8ee8; }
  .order-item { border-left-color:#8a4de8; }
  .title { font-weight: 600; font-size: 15px; }
  .meta { color:#888; font-size:12px; margin-top: 3px; }
  #roster { display:grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-bottom: 24px; }
  .squad-card { background:#161616; border-radius:8px; padding:10px 12px; }
  .squad-card h4 { margin:0 0 4px 0; font-size:13px; color:#aaa; }
  .squad-card .members { font-size:13px; color:#ccc; }
  .squad-card.Defense { border-left: 3px solid #3d8ee8; }
  .squad-card.Attack  { border-left: 3px solid #e8a33d; }
  .squad-card.Flex    { border-left: 3px solid #8a4de8; }
  .menu-nav-btn { font-size: 12px; padding: 6px 12px; background: #333; border: none; border-radius: 4px; color: #fff; cursor: pointer; text-decoration: none; margin-right: 8px; }
</style>
</head>
<body>
  <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 2px;">
    <h2 style="margin: 0;">Main Commander - Live Feed</h2>
    <a class="menu-nav-btn" href="/menu.html">☰ Меню</a>
    <button onclick="logout()" style="font-size: 12px; padding: 6px 12px; background: #333; border: none; border-radius: 4px; color: #fff; cursor: pointer;">Выйти</button>
  </div>
  <div id="status">connecting…</div>

  <div id="roster"></div>
  <div id="feed"></div>

<script>
  const currentUser = requireAuth(['Commander', 'Admin']);

  const connection = new signalR.HubConnectionBuilder()
    .withUrl("/battleHub?access_token=" + encodeURIComponent(currentUser.token))
    .withAutomaticReconnect()
    .build();

  const feed = document.getElementById('feed');

  connection.onreconnecting(() => setStatus("reconnecting…"));
  connection.onreconnected(() => setStatus("connected"));

  connection.on("BattleEvent", evt =>
    addItem(evt.severity, `${evt.enemyRole ?? evt.note ?? 'EVENT'} → ${evt.targetSquadId}`, evt.reporterName, evt.timestamp));

  connection.on("OrderIssued", order =>
    addItem('order-item', `ORDER ${order.type} → ${order.targetSquadId}`, order.issuerName, order.issuedAt));

  connection.on("RosterUpdated", roster => renderRoster(roster));

  connection.on("HistoryReset", () => { feed.innerHTML = ''; });


  connection.on("Snapshot", items => {
    items.forEach(i => {
      if ('reporterName' in i) {
        addItem(i.severity, `${i.enemyRole ?? i.note ?? 'EVENT'} → ${i.targetSquadId}`, i.reporterName, i.timestamp);
      } else {
        addItem('order-item', `ORDER ${i.type} → ${i.targetSquadId}`, i.issuerName, i.issuedAt);
      }
    });
  });

  connection.start()
    .then(() => setStatus("connected"))
    .catch(err => setStatus("connection failed: " + err));

  function renderRoster(roster) {
    const el = document.getElementById('roster');
    el.innerHTML = '';
    (roster || []).forEach(sq => {
      const card = document.createElement('div');
      card.className = 'squad-card ' + sq.side;

      const h4 = document.createElement('h4');
      h4.textContent = `${sq.squadId} · ${sq.side}`;

      const membersEl = document.createElement('div');
      membersEl.className = 'members';
      membersEl.textContent = (sq.members || []).join(', ') || '—';

      card.append(h4, membersEl);
      el.appendChild(card);
    });
  }

  function setStatus(text) {
    document.getElementById('status').textContent = text;
  }

  function addItem(cls, title, who, ts) {
    const div = document.createElement('div');
    div.className = 'feed-item ' + cls;

    const titleEl = document.createElement('div');
    titleEl.className = 'title';
    titleEl.textContent = title;

    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.textContent = `${who} · ${new Date(ts).toLocaleTimeString()}`;

    div.append(titleEl, metaEl);
    feed.prepend(div);
  }
</script>
</body>
</html>
