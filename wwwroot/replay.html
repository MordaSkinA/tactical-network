<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>GvG - Replay</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
<script src="/js/auth.js"></script>
<link rel="stylesheet" href="/css/theme.css">
<script src="/js/sidebar.js"></script>
<style>
  body { background: var(--bg, #0a0a0b); color: var(--text, #eee); font-family: 'Inter', system-ui, sans-serif; }

  /* ---------------- Ambient backdrop ---------------- */

  #rp-backdrop {
    position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden;
  }
  #rp-backdrop::before {
    content: '';
    position: absolute; inset: -10%;
    background-image:
      linear-gradient(rgba(124,108,240,0.05) 1px, transparent 1px),
      linear-gradient(90deg, rgba(124,108,240,0.05) 1px, transparent 1px);
    background-size: 42px 42px;
    animation: rpGridDrift 26s linear infinite;
    mask-image: radial-gradient(ellipse 70% 60% at 30% 20%, #000 40%, transparent 85%);
  }
  .rp-orb {
    position: absolute; border-radius: 50%; filter: blur(70px); opacity: 0.35;
    animation: rpOrbFloat 16s ease-in-out infinite;
  }
  .rp-orb-1 { width: 380px; height: 380px; top: -120px; left: 8%; background: #7c6cf0; animation-delay: 0s; }
  .rp-orb-2 { width: 300px; height: 300px; bottom: -80px; right: 10%; background: #4fd18b; animation-delay: -6s; opacity: 0.18; }
  .rp-orb-3 { width: 260px; height: 260px; top: 40%; right: 28%; background: #e05260; animation-delay: -11s; opacity: 0.12; }

  @keyframes rpGridDrift {
    0%   { transform: translate(0, 0); }
    100% { transform: translate(42px, 42px); }
  }
  @keyframes rpOrbFloat {
    0%, 100% { transform: translate(0, 0) scale(1); }
    50%      { transform: translate(24px, -18px) scale(1.08); }
  }

  #app-content, #app-sidebar { position: relative; z-index: 1; }

  /* ---------------- Header ---------------- */

  .rp-title-wrap { position: relative; display: inline-block; }
  .page-title.rp-title {
    background: linear-gradient(100deg, var(--text) 30%, var(--accent-light) 45%, #fff 50%, var(--accent-light) 55%, var(--text) 70%);
    background-size: 240% 100%;
    -webkit-background-clip: text;
    background-clip: text;
    color: transparent;
    animation: rpTitleShine 5s linear infinite;
  }
  @keyframes rpTitleShine {
    0%   { background-position: 200% 0; }
    100% { background-position: -40% 0; }
  }

  #status { display: inline-flex; align-items: center; gap: 7px; }
  #status .rp-dot {
    width: 7px; height: 7px; border-radius: 50%; background: var(--text-faint);
    box-shadow: 0 0 0 rgba(0,0,0,0);
    transition: background 0.3s ease, box-shadow 0.3s ease;
  }
  #status.connected .rp-dot { background: var(--success); box-shadow: 0 0 10px var(--success); animation: rpPulseDot 1.8s ease-in-out infinite; }
  #status.error .rp-dot { background: var(--danger); box-shadow: 0 0 10px var(--danger); }
  @keyframes rpPulseDot {
    0%, 100% { transform: scale(1); opacity: 1; }
    50%      { transform: scale(1.5); opacity: 0.55; }
  }

  .rp-stats { display: flex; gap: 8px; flex-wrap: wrap; }
  .rp-stat-pill {
    display: flex; align-items: center; gap: 6px;
    background: var(--surface-2); border: 1px solid var(--border);
    border-radius: var(--radius-pill); padding: 6px 12px 6px 10px;
    font-size: 12px; font-weight: 700; color: var(--text-dim);
    opacity: 0; animation: rpFadeUp 0.4s ease forwards;
  }
  .rp-stat-pill .rp-stat-dot { width: 8px; height: 8px; border-radius: 50%; flex: 0 0 auto; }
  .rp-stat-pill b { color: var(--text); font-weight: 800; }

  /* ---------------- Layout ---------------- */

  #layout { display: flex; gap: 22px; margin-top: 22px; align-items: flex-start; }

  #file-list {
    width: 270px; flex-shrink: 0; display: flex; flex-direction: column; gap: 8px;
    max-height: calc(100vh - 200px); overflow-y: auto; padding-right: 4px;
  }
  #file-list::-webkit-scrollbar { width: 6px; }
  #file-list::-webkit-scrollbar-thumb { background: var(--accent-dim); border-radius: 4px; }
  #file-list::-webkit-scrollbar-thumb:hover { background: var(--accent); }

  .file-btn {
    position: relative;
    text-align: left; background: var(--surface); border: 1px solid var(--border-soft); border-radius: var(--radius-md);
    padding: 12px 14px 12px 16px; color: var(--text-dim); font-size: 13px; cursor: pointer;
    display: flex; align-items: center; gap: 10px;
    overflow: hidden;
    opacity: 0; transform: translateX(-14px);
    animation: rpFadeInLeft 0.42s cubic-bezier(.2,.8,.2,1) forwards;
    transition: border-color 0.2s ease, background 0.2s ease, transform 0.2s ease, box-shadow 0.25s ease;
  }
  .file-btn::before {
    content: '';
    position: absolute; left: 0; top: 0; bottom: 0; width: 3px;
    background: var(--accent); opacity: 0; transition: opacity 0.2s ease;
  }
  .file-btn:hover { background: var(--surface-2); border-color: #33333a; transform: translateX(2px); }
  .file-btn.active {
    color: var(--text); border-color: var(--accent-dim);
    background: linear-gradient(90deg, var(--accent-soft-bg), transparent 70%);
    box-shadow: 0 0 0 1px var(--accent-dim), 0 8px 22px rgba(124,108,240,0.18);
  }
  .file-btn.active::before { opacity: 1; box-shadow: 0 0 10px var(--accent-light); }

  .file-btn .fb-icon {
    flex: 0 0 auto; width: 30px; height: 30px; border-radius: 8px;
    display: flex; align-items: center; justify-content: center;
    background: var(--surface-2); color: var(--text-faint);
    transition: color 0.2s ease, background 0.2s ease;
  }
  .file-btn.active .fb-icon { color: var(--accent-light); background: var(--accent-soft-bg); }
  .file-btn .fb-label { display: flex; flex-direction: column; gap: 2px; min-width: 0; flex: 1; }
  .file-btn .fb-date { font-weight: 700; color: inherit; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .file-btn .fb-sub { font-size: 11px; color: var(--text-faint); }

  .fb-actions { flex: 0 0 auto; display: flex; gap: 4px; margin-left: auto; }
  .fb-action {
    width: 26px; height: 26px; border-radius: 7px; border: 1px solid transparent;
    display: flex; align-items: center; justify-content: center;
    background: transparent; color: var(--text-faint); cursor: pointer;
    transition: color 0.15s ease, background 0.15s ease, border-color 0.15s ease, transform 0.15s ease;
  }
  .fb-action:hover { color: var(--text); background: var(--surface-2); border-color: var(--border-soft); transform: translateY(-1px); }
  .fb-action.danger:hover { color: var(--danger); background: rgba(224, 82, 96, 0.12); border-color: rgba(224, 82, 96, 0.3); }
  .fb-action svg { pointer-events: none; }

  @keyframes rpFadeInLeft {
    to { opacity: 1; transform: translateX(0); }
  }

  .hint { color: var(--text-faint); font-size: 13px; padding: 10px 2px; }

  /* ---------------- Skeleton loaders ---------------- */

  .rp-skel {
    border-radius: var(--radius-md); background: linear-gradient(100deg, var(--surface) 30%, var(--surface-2) 50%, var(--surface) 70%);
    background-size: 220% 100%;
    animation: rpShimmer 1.3s linear infinite;
  }
  .rp-skel-file { height: 52px; margin-bottom: 8px; }
  .rp-skel-item { height: 64px; margin-bottom: 10px; }
  @keyframes rpShimmer { to { background-position: -220% 0; } }

  /* ---------------- Panel ---------------- */

  #replay-panel { flex: 1; min-width: 0; }

  #replay-title {
    font-size: 13px; color: var(--text-dim); margin-bottom: 14px;
    display: flex; align-items: center; gap: 8px;
    font-family: 'SFMono-Regular', Consolas, monospace;
  }
  #replay-title .rp-blink { color: var(--accent-light); animation: rpBlink 1.1s steps(1) infinite; }
  @keyframes rpBlink { 50% { opacity: 0; } }

  #feed { display: flex; flex-direction: column; gap: 9px; }

  .feed-item {
    position: relative;
    padding: 13px 16px 13px 18px; border-radius: var(--radius-md);
    border-left: 4px solid #555; background: var(--surface);
    border: 1px solid var(--border-soft); border-left-width: 4px;
    opacity: 0; transform: translateY(10px) scale(0.99);
    animation: rpFadeUp 0.38s cubic-bezier(.2,.8,.2,1) forwards;
    transition: transform 0.18s ease, box-shadow 0.25s ease, background 0.2s ease;
  }
  .feed-item:hover {
    transform: translateY(-2px);
    background: var(--surface-2);
    box-shadow: 0 10px 24px rgba(0,0,0,0.35);
  }
  @keyframes rpFadeUp {
    to { opacity: 1; transform: translateY(0) scale(1); }
  }

  .Critical, .cat-critical { border-left-color: #e33; }
  .Warning  { border-left-color: #e8a33d; }
  .Info     { border-left-color: #3d8ee8; }
  .order-item { border-left-color: #8a4de8; }
  .cat-attack      { border-left-color: #c1622b; }
  .cat-attack-key  { border-left-color: #e8790f; }
  .cat-defend      { border-left-color: #4c7a4f; }
  .cat-hold        { border-left-color: #2e5230; }
  .cat-protect     { border-left-color: #4fae82; }
  .cat-tactic      { border-left-color: #7c6cf0; }
  .cat-fallback    { border-left-color: #4a90c4; }
  .cat-jungle      { border-left-color: #1e3a5f; }
  .cat-neutral     { border-left-color: #6b7280; }

  .feed-item.Critical, .feed-item.cat-critical {
    box-shadow: 0 0 0 1px rgba(238,51,51,0.25), 0 0 18px rgba(238,51,51,0.12);
    animation: rpFadeUp 0.38s cubic-bezier(.2,.8,.2,1) forwards, rpCriticalPulse 2.2s ease-in-out 0.5s infinite;
  }
  @keyframes rpCriticalPulse {
    0%, 100% { box-shadow: 0 0 0 1px rgba(238,51,51,0.25), 0 0 14px rgba(238,51,51,0.10); }
    50%      { box-shadow: 0 0 0 1px rgba(238,51,51,0.5), 0 0 26px rgba(238,51,51,0.32); }
  }

  .title { font-weight: 700; font-size: 14.5px; letter-spacing: -0.01em; }
  .meta {
    color: var(--text-faint); font-size: 11.5px; margin-top: 5px;
    font-family: 'SFMono-Regular', Consolas, monospace;
    display: flex; align-items: center; gap: 6px;
  }
  .meta::before { content: '›'; color: var(--accent-dim); font-weight: 900; }

  /* ---------------- Empty / feed fade transition ---------------- */

  #feed.rp-fading { animation: rpFeedOut 0.15s ease forwards; }
  @keyframes rpFeedOut { to { opacity: 0; transform: translateY(4px); } }

  @media (max-width: 860px) {
    #layout { flex-direction: column; }
    #file-list { width: 100%; max-height: 260px; }
  }
</style>
</head>
<body>
  <div id="rp-backdrop">
    <div class="rp-orb rp-orb-1"></div>
    <div class="rp-orb rp-orb-2"></div>
    <div class="rp-orb rp-orb-3"></div>
  </div>

  <div id="app-sidebar"></div>
  <div id="app-content"><div id="replay-inner">
  <div class="page-head">
    <div>
      <div class="rp-title-wrap"><h1 class="page-title rp-title">Replay</h1></div>
      <p class="page-subtitle" id="status"><span class="rp-dot"></span><span id="status-text">connecting…</span></p>
    </div>
    <div class="rp-stats" id="rp-stats"></div>
  </div>

  <div id="layout">
    <div id="file-list">
      <div class="rp-skel rp-skel-file"></div>
      <div class="rp-skel rp-skel-file"></div>
      <div class="rp-skel rp-skel-file"></div>
    </div>
    <div id="replay-panel">
      <div id="replay-title"><span class="rp-blink">■</span> Select a battle on the left</div>
      <div id="feed"></div>
    </div>
  </div>
  </div></div>

<script>
  const currentUser = requireAuth(['Commander', 'Admin', 'Developer']);
  renderSidebar('/replay.html');

  const connection = new signalR.HubConnectionBuilder()
    .withUrl("/battleHub?access_token=" + encodeURIComponent(currentUser.token))
    .withAutomaticReconnect()
    .build();

  const fileListEl = document.getElementById('file-list');
  const feedEl = document.getElementById('feed');
  const titleEl = document.getElementById('replay-title');
  const statsEl = document.getElementById('rp-stats');

  const ORDER_CATEGORIES = {
    SquadWiped: 'critical',
    PushBot: 'attack', PushMid: 'attack', PushTop: 'attack', AttackGoose: 'attack',
    KillBoss: 'attack-key', Bomb: 'attack-key',
    DefendBot: 'defend', DefendMid: 'defend', DefendTop: 'defend', DefendGoose: 'defend', DefendTree: 'defend',
    Hold: 'hold',
    ProtectHealer: 'protect',
    Rotate: 'tactic',
    FallBack: 'fallback',
    BotJungle: 'jungle', TopJungle: 'jungle'
  };
  function orderClass(type) {
    const category = ORDER_CATEGORIES[type];
    return category ? 'cat-' + category : 'order-item';
  }
  function alertClass(evt) {
    return evt.enemyRole != null ? 'Critical' : evt.severity;
  }
  const STATUS_CLASSES = {
    SquadWiped: 'cat-critical', Regroup: 'cat-defend', NeedHelp: 'cat-protect',
    Retreating: 'cat-fallback', Autonomous: 'cat-neutral'
  };
  function statusClass(type) { return STATUS_CLASSES[type] || 'order-item'; }

  const CAT_COLORS = {
    Critical: '#e33', 'cat-critical': '#e33', Warning: '#e8a33d', Info: '#3d8ee8', 'order-item': '#8a4de8',
    'cat-attack': '#c1622b', 'cat-attack-key': '#e8790f', 'cat-defend': '#4c7a4f', 'cat-hold': '#2e5230',
    'cat-protect': '#4fae82', 'cat-tactic': '#7c6cf0', 'cat-fallback': '#4a90c4', 'cat-jungle': '#1e3a5f', 'cat-neutral': '#6b7280'
  };

  function setStatus(text, state) {
    document.getElementById('status').className = state || '';
    document.getElementById('status-text').textContent = text;
  }

  connection.on("LogFileDeleted", (fileName) => removeFileFromList(fileName));

  connection.start()
    .then(() => { setStatus("connected", "connected"); loadFileList(); })
    .catch(err => setStatus("connection failed: " + err, "error"));

  async function loadFileList() {
    try {
      const files = await connection.invoke("ListLogFiles");
      fileListEl.innerHTML = '';
      if (!files.length) {
        fileListEl.innerHTML = '<div class="hint">No saved battles yet.</div>';
        return;
      }
      const canDelete = ['Admin', 'Developer'].includes(currentUser.role);
      files.forEach((f, idx) => {
        const btn = document.createElement('div');
        btn.className = 'file-btn';
        btn.tabIndex = 0;
        btn.dataset.fileName = f.fileName;
        btn.style.animationDelay = (idx * 45) + 'ms';
        btn.innerHTML = `
          <span class="fb-icon">
            <svg width="15" height="15" viewBox="0 0 24 24" fill="none"><path d="M4 4h11l5 5v11a2 2 0 0 1-2 2H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2Z" stroke="currentColor" stroke-width="2" stroke-linejoin="round"/><path d="M9 12h6M9 16h6" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
          </span>
          <span class="fb-label">
            <span class="fb-date">${formatFileLabel(f.savedAt)}</span>
            <span class="fb-sub">${escapeHtml(f.fileName)}</span>
          </span>
          <span class="fb-actions">
            <a class="fb-action" title="Download" download="${escapeHtml(f.fileName)}" href="${downloadUrl(f.fileName)}">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M12 3v12m0 0 4-4m-4 4-4-4" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/><path d="M4 17v2a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-2" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
            </a>
            ${canDelete ? `
            <button type="button" class="fb-action danger" title="Delete">
              <svg width="14" height="14" viewBox="0 0 24 24" fill="none"><path d="M4 7h16M9 7V5a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2m2 0-1 13a2 2 0 0 1-2 2H9a2 2 0 0 1-2-2L6 7" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
            </button>` : ''}
          </span>`;
        btn.querySelector('.fb-label').onclick = () => selectFile(f.fileName, btn);
        btn.querySelector('.fb-icon').onclick = () => selectFile(f.fileName, btn);
        btn.onkeydown = (e) => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); selectFile(f.fileName, btn); } };
        const downloadEl = btn.querySelector('.fb-actions a');
        downloadEl.onclick = (e) => e.stopPropagation();
        const deleteEl = btn.querySelector('.fb-actions button.danger');
        if (deleteEl) deleteEl.onclick = (e) => { e.stopPropagation(); deleteFile(f.fileName, btn); };
        fileListEl.appendChild(btn);
      });
    } catch (err) {
      fileListEl.innerHTML = '<div class="hint">Error: ' + err + '</div>';
    }
  }

  function formatFileLabel(savedAt) {
    const d = new Date(savedAt);
    return isNaN(d) ? savedAt : d.toLocaleString();
  }

  function escapeHtml(s) {
    return String(s ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
  }

  function downloadUrl(fileName) {
    return `/api/replays/${encodeURIComponent(fileName)}/download?access_token=${encodeURIComponent(currentUser.token)}`;
  }

  async function deleteFile(fileName, btnEl) {
    if (!confirm(`Delete replay "${fileName}"? This cannot be undone.`)) return;
    try {
      const ok = await connection.invoke("DeleteLogFile", fileName);
      if (!ok) { alert('Could not delete replay.'); return; }
      removeFileFromList(fileName);
    } catch (err) {
      alert('Error deleting replay: ' + err);
    }
  }

  function removeFileFromList(fileName) {
    const el = fileListEl.querySelector(`.file-btn[data-file-name="${CSS.escape(fileName)}"]`);
    const wasActive = el?.classList.contains('active');
    el?.remove();
    if (!fileListEl.querySelector('.file-btn')) {
      fileListEl.innerHTML = '<div class="hint">No saved battles yet.</div>';
    }
    if (wasActive) {
      titleEl.innerHTML = '<span class="rp-blink">■</span> Select a battle on the left';
      statsEl.innerHTML = '';
      feedEl.innerHTML = '';
    }
  }

  async function selectFile(fileName, btnEl) {
    document.querySelectorAll('.file-btn').forEach(b => b.classList.remove('active'));
    btnEl.classList.add('active');
    titleEl.innerHTML = `<span class="rp-blink">■</span> ${escapeHtml(fileName)}`;
    statsEl.innerHTML = '';

    feedEl.classList.add('rp-fading');
    await new Promise(r => setTimeout(r, 120));
    feedEl.classList.remove('rp-fading');
    feedEl.innerHTML = '<div class="rp-skel rp-skel-item"></div><div class="rp-skel rp-skel-item"></div><div class="rp-skel rp-skel-item"></div>';

    try {
      const raw = await connection.invoke("GetLogFile", fileName);
      const items = JSON.parse(raw);
      feedEl.innerHTML = '';
      if (!items.length) {
        feedEl.innerHTML = '<div class="hint">Empty log.</div>';
        return;
      }
      const counts = {};
      items.forEach((i, idx) => {
        let cls;
        if ('eventId' in i) { cls = alertClass(i); addItem(cls, `${i.enemyRole ?? i.note ?? 'EVENT'} → ${i.targetSquadId}`, i.reporterName, i.timestamp, idx); }
        else if ('orderId' in i) { cls = orderClass(i.type); addItem(cls, `ORDER ${i.type} → ${i.targetSquadId}`, i.issuerName, i.issuedAt, idx); }
        else { cls = statusClass(i.type); addItem(cls, `STATUS ${i.type} → ${i.targetSquadId}`, i.reporterName, i.timestamp, idx); }
        counts[cls] = (counts[cls] || 0) + 1;
      });
      renderStats(items.length, counts);
    } catch (err) {
      feedEl.innerHTML = '<div class="hint">Error: ' + err + '</div>';
    }
  }

  function renderStats(total, counts) {
    const entries = Object.entries(counts).sort((a, b) => b[1] - a[1]).slice(0, 5);
    let html = `<div class="rp-stat-pill" style="animation-delay:0ms"><b>${total}</b> events</div>`;
    entries.forEach(([cls, n], idx) => {
      const color = CAT_COLORS[cls] || '#6b7280';
      html += `<div class="rp-stat-pill" style="animation-delay:${(idx + 1) * 60}ms">
        <span class="rp-stat-dot" style="background:${color}; box-shadow:0 0 8px ${color}"></span><b>${n}</b> ${cls.replace('cat-', '')}
      </div>`;
    });
    statsEl.innerHTML = html;
  }

  function addItem(cls, title, who, ts, idx) {
    const div = document.createElement('div');
    div.className = 'feed-item ' + cls;
    div.style.animationDelay = Math.min(idx * 22, 900) + 'ms';

    const titleEl2 = document.createElement('div');
    titleEl2.className = 'title';
    titleEl2.textContent = title;

    const metaEl = document.createElement('div');
    metaEl.className = 'meta';
    metaEl.textContent = `${who} · ${new Date(ts).toLocaleTimeString()}`;

    div.append(titleEl2, metaEl);
    feedEl.appendChild(div);
  }
</script>
</body>
</html>
