<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GvG — Player</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="/js/auth.js"></script>
    <style>
        body {
            background: #0b0b0b;
            color: #eee;
            font-family: system-ui, sans-serif;
            padding: 20px;
            max-width: 480px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 14px;
        }

        #status {
            color: #666;
            font-size: 12px;
        }

        .logout-btn {
            font-size: 11px;
            padding: 4px 8px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
        }

        .user-info {
            font-size: 13px;
            color: #aaa;
            margin-bottom: 24px;
            text-align: center;
        }

        #order-banner {
            background: #1a1a1a;
            border-radius: 12px;
            padding: 22px;
            text-align: center;
            margin-bottom: 20px;
            border: 2px solid #333;
        }

            #order-banner .label {
                font-size: 12px;
                color: #888;
                text-transform: uppercase;
                letter-spacing: 0.06em;
            }

            #order-banner .value {
                font-size: 30px;
                font-weight: 800;
                margin-top: 6px;
            }

            #order-banner.has-order {
                border-color: #2f6fb2;
            }

        #alerts {
            margin-bottom: 24px;
        }

        .alert-item {
            padding: 12px 14px;
            margin-bottom: 8px;
            border-radius: 8px;
            border-left: 4px solid #555;
            background: #161616;
            font-size: 14px;
        }

        .Critical {
            border-left-color: #e33;
        }

        .Warning {
            border-left-color: #e8a33d;
        }

        .Info {
            border-left-color: #3d8ee8;
        }

        .meta {
            color: #888;
            font-size: 11px;
            margin-top: 3px;
        }

        #sos {
            width: 100%;
            padding: 20px;
            font-size: 20px;
            font-weight: 800;
            color: #fff;
            background: #a4202a;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

            #sos:active {
                transform: scale(0.98);
            }
    </style>
</head>
<body>
    <div class="header">
        <div id="status">connecting…</div>
        <button class="logout-btn" onclick="logout()">Выйти</button>
    </div>

    <div class="user-info" id="user-info">Загрузка...</div>

    <div id="order-banner">
        <div class="label">Current order</div>
        <div class="value" id="order-value">—</div>
    </div>

    <div id="alerts"></div>

    <button id="sos" onclick="sendSos()">SOS</button>

    <script>

        const currentUser = requireAuth(['Player', 'Leader', 'Admin']);
        if (currentUser) {
            document.getElementById('user-info').textContent = `Боец: ${currentUser.username} | Отряд: ${currentUser.squadId || 'Нет'}`;
        }

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/battleHub")
            .withAutomaticReconnect()
            .build();

        connection.onreconnecting(() => setStatus("reconnecting…"));
        connection.onreconnected(() => setStatus("connected"));

        connection.on("BattleEvent", evt => {
            if (evt.targetSquadId !== currentUser.squadId) return;
            addAlert(evt.severity, `${evt.enemyRole ?? evt.note ?? 'EVENT'}`, evt.timestamp);
        });

        connection.on("OrderIssued", order => {
            if (order.targetSquadId !== currentUser.squadId) return;
            setOrder(order.type);
        });

        connection.on("Snapshot", items => {
            items.forEach(i => {
                if ('reporterName' in i) {
                    if (i.targetSquadId === currentUser.squadId) addAlert(i.severity, i.enemyRole ?? i.note ?? 'EVENT', i.timestamp);
                } else {
                    if (i.targetSquadId === currentUser.squadId) setOrder(i.type);
                }
            });
        });

        connection.on("HistoryReset", () => {
            document.getElementById('alerts').innerHTML = '';
            setOrder(null);
        });

        connection.start()
            .then(() => setStatus("connected"))
            .catch(err => setStatus("connection failed: " + err));

        function sendSos() {
            if (!currentUser || !currentUser.squadId) return alert("У вас не назначен отряд!");
            connection.invoke("Sos", { reporterName: currentUser.username, squadId: currentUser.squadId })
                .catch(err => console.error(err));
        }

        function setOrder(type) {
            const el = document.getElementById('order-value');
            const banner = document.getElementById('order-banner');
            if (!type) {
                el.textContent = '—';
                banner.classList.remove('has-order');
                return;
            }
            el.textContent = type.replace(/([A-Z])/g, ' $1').trim().toUpperCase();
            banner.classList.add('has-order');
        }

        function addAlert(severity, title, ts) {
            const el = document.getElementById('alerts');
            const div = document.createElement('div');
            div.className = 'alert-item ' + severity;
            div.innerHTML = `${title}<div class="meta">${new Date(ts).toLocaleTimeString()}</div>`;
            el.prepend(div);
            while (el.children.length > 8) el.removeChild(el.lastChild);
        }

        function setStatus(text) { document.getElementById('status').textContent = text; }
    </script>
</body>
</html>
