<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GvG — Observer</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/microsoft-signalr/8.0.0/signalr.min.js"></script>
    <script src="/js/auth.js"></script>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
            padding: 20px;
            max-width: 700px;
            margin: 0 auto;
        }

        h2 {
            margin-bottom: 4px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }

        .hint {
            color: #888;
            font-size: 13px;
            margin-bottom: 20px;
        }

        .header-btn {
            font-size: 12px;
            padding: 6px 12px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
        }

        .user-info {
            background: #222;
            padding: 10px;
            border-radius: 6px;
            margin-bottom: 20px;
            font-size: 14px;
            border: 1px solid #444;
        }

        h3 {
            margin-top: 28px;
            margin-bottom: 10px;
            color: #aaa;
            font-size: 14px;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .row {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        button.action-btn {
            font-size: 17px;
            padding: 16px 18px;
            border: none;
            border-radius: 10px;
            cursor: pointer;
            color: #fff;
            min-width: 130px;
            font-weight: 600;
        }

            button.action-btn:active {
                transform: scale(0.97);
            }

        .enemy {
            background: #b23b3b;
        }

        .order {
            background: #2f6fb2;
        }

        #status {
            font-size: 12px;
            color: #666;
            margin-top: 20px;
        }

        #log {
            font-size: 12px;
            color: #777;
            margin-top: 14px;
            white-space: pre-wrap;
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #333;
            padding-top: 10px;
        }

        .menu-nav-btn {
            font-size: 12px;
            padding: 6px 12px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
            text-decoration: none;
            margin-right: 8px;
        }
    </style>
</head>
<body>
    <h2>Observer <span><a class="menu-nav-btn" href="/menu.html">☰ Меню</a><button class="header-btn" onclick="logout()">Выйти</button></span></h2>
    <div class="hint">Отправка репортов и приказов для вашего отряда.</div>

    <div class="user-info" id="user-info">
        Загрузка профиля...
    </div>

    <h3>Enemy detected</h3>
    <div class="row">
        <button class="action-btn enemy" onclick="reportEnemy('TwinBlades')">ENEMY TB</button>
        <button class="action-btn enemy" onclick="reportEnemy('Healer')">ENEMY HEALER</button>
        <button class="action-btn enemy" onclick="reportEnemy('Tank')">ENEMY TANK</button>
        <button class="action-btn enemy" onclick="reportEnemy('Nameless')">ENEMY NAMELESS</button>
    </div>

    <h3>Orders</h3>
    <div class="row">
        <button class="action-btn order" onclick="issueOrder('Push')">PUSH</button>
        <button class="action-btn order" onclick="issueOrder('Hold')">HOLD</button>
        <button class="action-btn order" onclick="issueOrder('FallBack')">FALL BACK</button>
        <button class="action-btn order" onclick="issueOrder('Rotate')">ROTATE</button>
        <button class="action-btn order" onclick="issueOrder('Defend')">DEFEND</button>
        <button class="action-btn order" onclick="issueOrder('ProtectHealer')">PROTECT HEALER</button>
    </div>

    <div id="status">connecting…</div>
    <div id="log"></div>

    <script>

        const currentUser = requireAuth(['Leader', 'Admin']);
        if (currentUser) {
            document.getElementById('user-info').innerHTML = `Вы вошли как: <strong>${currentUser.username}</strong> <br> Отряд: <strong>${currentUser.squadId || 'Не назначен'}</strong>`;
        }

        const connection = new signalR.HubConnectionBuilder()
            .withUrl("/battleHub?access_token=" + encodeURIComponent(currentUser.token))
            .withAutomaticReconnect()
            .build();

        connection.onreconnecting(() => setStatus("reconnecting…"));
        connection.onreconnected(() => setStatus("connected"));

        connection.on("BattleEvent", evt =>
            log(`[${evt.severity}] ${evt.enemyRole ?? evt.note ?? ''} → ${evt.targetSquadId} (by ${evt.reporterName})`));

        connection.on("OrderIssued", order =>
            log(`ORDER ${order.type} → ${order.targetSquadId} (by ${order.issuerName})`));

        connection.start()
            .then(() => setStatus("connected"))
            .catch(err => setStatus("connection failed: " + err));

        function reportEnemy(role) {
            connection.invoke("ReportEvent", { enemyRole: role, note: null })
                .catch(err => log("Error: " + err));
        }

        function issueOrder(type) {
            connection.invoke("IssueOrder", { type: type })
                .catch(err => log("Error: " + err));
        }

        function setStatus(text) { document.getElementById('status').textContent = text; }
        function log(msg) {
            const el = document.getElementById('log');
            el.textContent = new Date().toLocaleTimeString() + "  " + msg + "\n" + el.textContent;
        }
    </script>
</body>
</html>
