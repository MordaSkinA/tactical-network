<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>GvG — Меню</title>
    <script src="/js/auth.js"></script>
    <style>
        body {
            background: #111;
            color: #eee;
            font-family: system-ui, sans-serif;
            padding: 40px 20px;
            max-width: 420px;
            margin: 0 auto;
        }

        h2 {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 6px;
        }

        .hint {
            color: #888;
            font-size: 13px;
            margin-bottom: 28px;
        }

        .tab-list {
            display: flex;
            flex-direction: column;
            gap: 12px;
        }

        .tab-btn {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: #1a1a1a;
            border: 1px solid #333;
            border-radius: 10px;
            padding: 16px 18px;
            color: #eee;
            text-decoration: none;
            font-size: 15px;
            font-weight: 600;
            transition: background 0.15s;
        }

            .tab-btn:hover {
                background: #222;
            }

            .tab-btn .arrow {
                color: #666;
            }

        .header-btn {
            font-size: 12px;
            padding: 6px 12px;
            background: #333;
            border: none;
            border-radius: 4px;
            color: #fff;
            cursor: pointer;
        }
    </style>
</head>
<body>
    <h2>Меню <button class="header-btn" onclick="logout()">Выйти</button></h2>
    <div class="hint" id="hint">Загрузка...</div>
    <div class="tab-list" id="tab-list"></div>

    <script>
        const currentUser = requireAuth(['Player', 'Leader', 'Commander', 'Admin']);

        document.getElementById('hint').textContent =
            `Вы вошли как ${currentUser.username} (${currentUser.role}). Доступные вкладки:`;

        const labels = { Player: 'Player — свой отряд', Observer: 'Observer', Dashboard: 'Dashboard', Admin: 'Admin Panel' };

        const tabs = getAccessibleTabs(currentUser.role);
        document.getElementById('tab-list').innerHTML = tabs.map(t => `
            <a class="tab-btn" href="${t.url}">
                <span>${labels[t.label] || t.label}</span>
                <span class="arrow">→</span>
            </a>
        `).join('');
    </script>
</body>
</html>
